schema_version: 1
project: shifter
github_repo: Brad-Edwards/shifter
workflow:
  # shifter has no single-command test suite; CI runs many parallel jobs.
  # lint_command is the single most useful local gate.
  lint_command: python3 scripts/adr_guard/adr_guard.py --all --level ci
  # test_command intentionally omitted; the implement skill falls back to
  # asking the agent which sub-project to test. completion_command below is
  # the full gate set that must be green before a change is declared done.
  completion_command: >-
    python3 scripts/adr_guard/adr_guard.py --all --level ci &&
    (cd shifter/shifter_platform && uv run ruff check . &&
    uv run ruff format --check . &&
    uv run lint-imports --config ../../.importlinter) &&
    (cd shifter/shifter_platform && TESTING=1 TEST_DB_BACKEND=sqlite
    DJANGO_DEBUG=true DJANGO_SECRET_KEY=local uv run pytest tests/
    -m "not redis and not postgres") &&
    (cd shifter/shifter_platform && TESTING=1 TEST_DB_BACKEND=postgres
    DJANGO_DEBUG=true DJANGO_SECRET_KEY=local DB_HOST=localhost DB_PORT=5432
    DB_NAME=shifter DB_USER=test DB_PASSWORD=test uv run pytest tests/
    -m "not redis") &&
    (cd shifter/shifter_platform && TESTING=1 TEST_DB_BACKEND=sqlite
    DJANGO_DEBUG=true DJANGO_SECRET_KEY=local uv run python manage.py
    makemigrations --check --dry-run) &&
    (cd shifter/shifter_platform/frontend && npm run typecheck &&
    npm run lint && npm run test:coverage) &&
    (cd mcp/ops && node --test) &&
    git diff --name-only origin/dev...HEAD -- '*.md' | xargs -r vale
  review_disposition:
    enabled: true
    mode: shadow
    max_auto_overrides: 1
    judge:
      enabled: true
sonarcloud:
  project_key: Brad-Edwards_shifter
  organization: brad-edwards
routing:
  enabled: true
  default_provider: claude
  default_fallback: parent
rules:
  plan_rules: .gc/plan-rules.md
