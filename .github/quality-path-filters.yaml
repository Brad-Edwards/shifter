# Path filter categories for _quality.yml subtree targeting (issue #774).
# Consumed by the `paths` job in .github/workflows/_quality.yml via
# dorny/paths-filter. A change under `.github/workflows/**` forces the
# full matrix through the `ci_workflows` output combined with `run_all`.

ci_workflows:
  - '.github/workflows/**'
  - '.github/quality-path-filters.yaml'

shifter_platform:
  - 'shifter/shifter_platform/**'
  - '.importlinter'

provisioner:
  - 'shifter/engine/provisioner/**'

cyberscript:
  - 'shifter/cyberscript/**'

packer:
  - 'shifter/packer/**'

bootstrap:
  - 'scripts/bootstrap/**'

gcp_scripts:
  - 'scripts/gcp/**'

check_layer_imports:
  - 'scripts/check_layer_imports/**'

check_rds_pending_modifications:
  - 'scripts/check_rds_pending_modifications/**'

handle_sd_replacement:
  - 'scripts/handle_sd_replacement/**'

assert_portal_inspection:
  - 'scripts/assert_portal_inspection/**'

installation:
  - 'shifter/installation/**'

event_load_harness:
  - 'uat/event-load-harness/**'

terraform:
  - 'platform/terraform/**'
  - '.tflint.hcl'
  - 'scripts/check_tf_iam_ec2_scope/**'
  - 'scripts/check_tf_iam_elb_scope/**'
  - 'scripts/check_tf_sg_cidrs/**'
  - 'scripts/check_tf_kms_secrets_grant/**'
  - 'scripts/check_tf_rds_security/**'
  - 'scripts/check_tf_iam_ssm_range_scope/**'
  - 'scripts/check_tf_iam_bedrock_agent_scope/**'
  - 'scripts/check_portal_target_sg_sources/**'
  # Root init/validate gate (#1528): the inventory checker plus the two
  # Terraform roots that live outside platform/terraform/. The broad
  # provisioner terraform/** entry also covers the per-range module iam.tf that
  # the check_tf_iam_bedrock_agent_scope guard (#1377) validates.
  - 'scripts/check_tf_roots/**'
  - 'scripts/polaris-aws-range/**'
  - 'shifter/engine/provisioner/terraform/**'

k8s:
  - 'platform/k8s/**'
  - '.kube-linter.yaml'

mcp_ngfw:
  - 'mcp/ngfw/**'

mcp_ops:
  - 'mcp/ops/**'

mcp_planner:
  - 'mcp/planner/**'

mcp_shared:
  - 'mcp/shared/**'

adr_guard:
  - 'scripts/adr_guard/**'
  - 'docs/adr/**'
  - '.pre-commit-config.yaml'
  - 'AGENTS.md'
  - '.ground-control.yaml'
  - '.gc/plan-rules.md'
  - '.shifter.yaml'
  # ADR-024-R4 / #1313: route parity-inventory edits through adr-conformance so
  # the aces-parity-inventory-path-integrity check runs when the ledger itself
  # changes. Referenced paths are deliberately NOT duplicated here; the
  # always-run pre-commit hook is the catch-all for deletions elsewhere.
  - 'docs/architecture/aces-migration-parity-inventory.yaml'

ctfd_workshop:
  - 'scripts/ctfd-workshop/**'

polaris_aws_range:
  - 'scripts/polaris-aws-range/**'

scenario_smoketest:
  - 'scenario-dev/polaris/tests/**'

stack_smoke:
  - 'scripts/stack-smoke/**'
