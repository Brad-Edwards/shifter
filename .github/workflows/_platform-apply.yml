name: Platform - apply

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      is_dev:
        required: true
        type: boolean
      apply_changes:
        required: true
        type: boolean
      platform_changes:
        required: true
        type: boolean
      engine_image_digest:
        required: false
        type: string
        default: ""
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_ARN_DEV:
        required: true
      AWS_ROLE_ARN_PROOF:
        required: false
      TF_VARS_DEV_PORTAL:
        required: false
      TF_VARS_PROOF_PORTAL:
        required: false
      TF_VARS_PROD_PORTAL:
        required: false
      TF_INFRA_STATE_BUCKET:
        required: false
      TF_INFRA_STATE_BUCKET_DEV:
        required: false
      TF_INFRA_STATE_BUCKET_PROOF:
        required: false
      SHIFTER_CONFIG_DEV_RANGE:
        required: false
      SHIFTER_CONFIG_PROOF_RANGE:
        required: false
      SHIFTER_CONFIG_PROD_RANGE:
        required: false

jobs:
  apply:
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    name: Apply (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only (see #1220). Generous so a cold apply is never cut off.
    timeout-minutes: 120
    environment: ${{ inputs.github_environment }}
    defaults:
      run:
        working-directory: platform/terraform/environments/${{ inputs.environment }}/portal
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.13.3"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Render local.auto.tfvars from deployment secret
        # The committed terraform.tfvars ships an example.com baseline that
        # fails-loud on apply. Each deployment provides its real values via the
        # TF_VARS_<ENV>_PORTAL GitHub secret; this step renders that payload
        # into a gitignored local.auto.tfvars that Terraform auto-loads over
        # the baseline before plan and apply. See docs/dev/deploy-secrets.md.
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ENGINE_IMAGE_DIGEST: ${{ inputs.engine_image_digest }}
          ENGINE_TASK_FAMILY: ${{ inputs.environment }}-portal-pulumi-provisioner
          TF_VARS_DEV_PORTAL: ${{ secrets.TF_VARS_DEV_PORTAL }}
          TF_VARS_PROOF_PORTAL: ${{ secrets.TF_VARS_PROOF_PORTAL }}
          TF_VARS_PROD_PORTAL: ${{ secrets.TF_VARS_PROD_PORTAL }}
        run: |
          # Select strictly on inputs.environment in shell. A GitHub Actions
          # `is_dev && DEV_SECRET || PROD_SECRET` expression is unsafe: an
          # empty active-environment secret is falsy and falls through to
          # the other environment's secret. Selecting in shell keeps an
          # empty active secret empty so the check below trips fail-loud.
          case "$ENVIRONMENT" in
            dev)
              PORTAL_SECRET_NAME="TF_VARS_DEV_PORTAL"
              TF_VARS_PORTAL="${TF_VARS_DEV_PORTAL}"
              ;;
            proof)
              PORTAL_SECRET_NAME="TF_VARS_PROOF_PORTAL"
              TF_VARS_PORTAL="${TF_VARS_PROOF_PORTAL}"
              ;;
            prod)
              PORTAL_SECRET_NAME="TF_VARS_PROD_PORTAL"
              TF_VARS_PORTAL="${TF_VARS_PROD_PORTAL}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${TF_VARS_PORTAL}" ]; then
            echo "::error::Required secret ${PORTAL_SECRET_NAME} is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          printf '%s\n' "${TF_VARS_PORTAL}" > local.auto.tfvars
          resolve_engine_image_digest() {
            local digest="${ENGINE_IMAGE_DIGEST}"
            if [ -n "${digest}" ]; then
              if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::Engine build did not produce a valid ECR image digest"
                exit 1
              fi
              printf '%s\n' "${digest}"
              return
            fi

            local current_image
            if ! current_image=$(aws ecs describe-task-definition --task-definition "${ENGINE_TASK_FAMILY}" --query 'taskDefinition.containerDefinitions[0].image' --output text 2>/dev/null); then
              echo "::error::No engine image digest was provided and ECS task definition ${ENGINE_TASK_FAMILY} could not be read. Run a deploy path that builds the engine image so Terraform receives the build digest."
              exit 1
            fi
            if [[ "${current_image}" =~ @(sha256:[0-9a-f]{64})$ ]]; then
              printf '%s\n' "${BASH_REMATCH[1]}"
              return
            fi
            echo "::error::Existing ECS task definition ${ENGINE_TASK_FAMILY} is not digest-pinned (${current_image}). Run the engine image deploy first so platform Terraform can preserve a digest."
            exit 1
          }
          printf 'engine_container_image_digest = "%s"\n' "$(resolve_engine_image_digest)" > zz-engine-image.auto.tfvars
      - name: Render cloud_provider.auto.tfvars from shifter.yaml
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHIFTER_CONFIG_DEV_RANGE: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
          SHIFTER_CONFIG_PROOF_RANGE: ${{ secrets.SHIFTER_CONFIG_PROOF_RANGE }}
          SHIFTER_CONFIG_PROD_RANGE: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}
        run: |
          # Select strictly on inputs.environment in shell (same rule as the
          # local.auto.tfvars step above): an empty active-environment config
          # must fail loud, never fall through to the other environment's secret.
          case "$ENVIRONMENT" in
            dev)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_DEV_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_DEV_RANGE}"
              ;;
            proof)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_PROOF_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_PROOF_RANGE}"
              ;;
            prod)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_PROD_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_PROD_RANGE}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${ACTIVE_SHIFTER_CONFIG}" ]; then
            echo "::error::Required secret ${CONFIG_SECRET_NAME} is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          # Write the deployment config to an ephemeral file outside the repo tree,
          # then render its settings.backend into the renderer-owned CLOUD_PROVIDER
          # tfvars (PLAT-2005), so the deployed backend identity comes from
          # shifter.yaml, not a hardcoded Terraform literal. shifter.yaml holds
          # secret *references*, not values, but is still treated as sensitive:
          # written by redirection, never echoed, passed in argv, or uploaded as
          # an artifact (#1015).
          CONFIG_FILE="${RUNNER_TEMP}/shifter.yaml"
          printf '%s\n' "${ACTIVE_SHIFTER_CONFIG}" > "${CONFIG_FILE}"
          uv run --project "${GITHUB_WORKSPACE}/shifter/installation" \
            shifter-config render-runtime "${CONFIG_FILE}" \
            --output cloud_provider.auto.tfvars
      - name: Render Terraform backend configs
        working-directory: ${{ github.workspace }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
          TF_INFRA_STATE_BUCKET_PROD: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_DEV"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_DEV}"
              ;;
            proof)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_PROOF"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROOF}"
              ;;
            prod)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROD}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${STATE_BUCKET}" ]; then
            echo "::error::Required secret ${BUCKET_SECRET_NAME} is not set for the ${ENVIRONMENT} Terraform backend"
            exit 1
          fi
          python3 scripts/terraform/render_aws_backend_configs.py \
            --bucket "${STATE_BUCKET}" \
            --env "${{ inputs.environment }}" \
            --stack portal \
            --github-env
      - run: terraform init -backend-config="${SHIFTER_BACKEND_CONFIG_PATH}"
      - name: Plan
        run: |
          terraform plan -detailed-exitcode -lock-timeout=5m -var-file="${SHIFTER_PORTAL_REMOTE_STATE_TFVARS}" -out=tfplan 2>&1 || PLAN_EXIT=$?
          if [ "${PLAN_EXIT:-0}" != "0" ] && [ "${PLAN_EXIT:-0}" != "2" ]; then
            echo "::error::Terraform plan failed with exit code ${PLAN_EXIT}"
            exit "${PLAN_EXIT}"
          fi
          if [ ! -f tfplan ]; then
            echo "::error::Terraform did not create the expected saved plan tfplan"
            exit 1
          fi
          terraform show -no-color tfplan
      - name: Drain Service Discovery registrations before apply
        # Detects aws_service_discovery_service deletes in the saved plan and
        # scales the affected ECS services to 0, polling until Cloud Map
        # deregisters all instances. Writes sd_replacement_snapshot.json for
        # the restore step. No-op (empty snapshot) when no SD deletion is planned.
        # See scripts/handle_sd_replacement/handle_sd_replacement.py.
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/handle_sd_replacement/handle_sd_replacement.py" \
            drain --tf-plan tfplan --tf-outputs-from .
      - run: terraform apply -lock-timeout=5m tfplan
      - name: Restore ECS desired counts after apply
        # Reads sd_replacement_snapshot.json written by the drain step and
        # scales each ECS service back to its original desiredCount.
        # Idempotent: no-op when the snapshot is empty or absent.
        #
        # Runs on every non-cancelled outcome (`!cancelled()`), including a
        # failed drain or failed `terraform apply`. The drain step scales ECS
        # services to 0 out of band, and aws_ecs_service.guacd ignores
        # desired_count drift, so Terraform will NOT bring it back: if a
        # failure between drain and this step skipped restore, the service
        # would be stranded at 0. The failure-safe condition guarantees the
        # out-of-band mutation always has its restore path. It does not mask a
        # failed apply — the failed step still fails the job.
        # See scripts/handle_sd_replacement/handle_sd_replacement.py.
        if: ${{ !cancelled() }}
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/handle_sd_replacement/handle_sd_replacement.py" \
            restore --snapshot sd_replacement_snapshot.json
      - name: Assert portal inspection route/endpoint wiring
        # When portal east-west inspection is enabled, the direct private->NAT
        # default route is removed, so a stale / wrong-AZ / unhealthy firewall
        # endpoint silently blackholes egress while `terraform apply` still
        # succeeds. This post-apply check proves the live route tables point at
        # the healthy per-AZ Network Firewall endpoints from
        # firewall_status.sync_states and fails the deploy otherwise. It is a
        # no-op when inspection is disabled, so it runs for every environment.
        # See scripts/assert_portal_inspection/assert_portal_inspection.py.
        working-directory: platform/terraform/environments/${{ inputs.environment }}/portal
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/assert_portal_inspection/assert_portal_inspection.py" \
            --tf-outputs-from .
      - name: Verify RDS pending modifications applied (dev only)
        # Dev opts into apply_immediately=true so any post-apply
        # PendingModifiedValues means the deploy is incomplete. Prod
        # deliberately keeps apply_immediately=false so RDS changes flow
        # through the configured maintenance window — running the check
        # there would fail every legitimate prod deploy.
        # See scripts/check_rds_pending_modifications/check_rds_pending_modifications.py
        # and dev/terraform.md "RDS Change Application".
        if: inputs.is_dev
        working-directory: platform/terraform/environments/${{ inputs.environment }}/portal
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/check_rds_pending_modifications/check_rds_pending_modifications.py" \
            --tf-outputs-from .
      - name: Wait for Guacamole ECS services to stabilize
        env:
          ENV: ${{ inputs.environment }}
        run: |
          CLUSTER_NAME="${ENV}-portal-guacamole"
          GUACD_SERVICE="${ENV}-portal-guacd"
          CLIENT_SERVICE="${ENV}-portal-guacamole-client"

          # Check if cluster exists
          if ! aws ecs describe-clusters --clusters "$CLUSTER_NAME" --query "clusters[0].status" --output text 2>/dev/null | grep -q "ACTIVE"; then
            echo "Guacamole cluster not found, skipping stability check"
            exit 0
          fi

          # If services are stuck in FAILED state (e.g. from a prior failed deploy),
          # force a new deployment so they retry with the now-available images
          for SVC in "$GUACD_SERVICE" "$CLIENT_SERVICE"; do
            STATE=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SVC" \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].rolloutState" \
              --output text 2>/dev/null || echo "UNKNOWN")
            if [ "$STATE" = "FAILED" ]; then
              echo "::warning::$SVC deployment is FAILED — forcing new deployment"
              aws ecs update-service --cluster "$CLUSTER_NAME" --service "$SVC" --force-new-deployment --no-cli-pager
            fi
          done

          echo "Waiting for Guacamole ECS services to stabilize..."

          # Poll with extended timeout (40 × 30s = 20min)
          # Default aws ecs wait (10min) is too short for first deploy
          # where RDS init + schema creation + JVM startup can take a while
          ATTEMPTS=0
          MAX_ATTEMPTS=40
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            GUACD_STATUS=$(aws ecs describe-services --cluster "$CLUSTER_NAME" \
              --services "$GUACD_SERVICE" \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].rolloutState" \
              --output text 2>/dev/null || echo "UNKNOWN")

            CLIENT_STATUS=$(aws ecs describe-services --cluster "$CLUSTER_NAME" \
              --services "$CLIENT_SERVICE" \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].rolloutState" \
              --output text 2>/dev/null || echo "UNKNOWN")

            echo "guacd: $GUACD_STATUS | guacamole-client: $CLIENT_STATUS"

            if [ "$GUACD_STATUS" = "COMPLETED" ] && [ "$CLIENT_STATUS" = "COMPLETED" ]; then
              echo "Guacamole ECS services are stable"
              exit 0
            fi

            # Fail fast if circuit breaker triggered a rollback
            if [ "$GUACD_STATUS" = "FAILED" ] || [ "$CLIENT_STATUS" = "FAILED" ]; then
              echo "::error::Deployment failed — circuit breaker triggered rollback"
              exit 1
            fi

            ATTEMPTS=$((ATTEMPTS + 1))
            sleep 30
          done

          # Timeout is a failed deploy, not a warning: a green run that leaves
          # Guacamole unstable reproduces the event-day inconsistent-RDP symptom
          # with no pipeline evidence. The FAILED circuit-breaker branch above
          # already exits 1; the timeout must too. If first boot legitimately
          # needs longer, raise MAX_ATTEMPTS rather than downgrading the result.
          echo "::error::Guacamole ECS services did not stabilize within 20 minutes (guacd: $GUACD_STATUS | guacamole-client: $CLIENT_STATUS) on cluster $CLUSTER_NAME. Inspect the ECS service events for $GUACD_SERVICE / $CLIENT_SERVICE."
          exit 1
