name: Platform - deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      portal_image_changes:
        required: true
        type: boolean
      apply_changes:
        required: true
        type: boolean
      platform_changes:
        required: true
        type: boolean
      image_digest:
        required: false
        type: string
        default: ""
      image_tag:
        required: false
        type: string
        default: ""
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_ARN_DEV:
        required: true
      AWS_ROLE_ARN_PROOF:
        required: false
      TF_INFRA_STATE_BUCKET:
        required: false
      TF_INFRA_STATE_BUCKET_DEV:
        required: false
      TF_INFRA_STATE_BUCKET_PROOF:
        required: false
      PLATFORM_BOOTSTRAP_STAFF_EMAILS:
        required: false
      PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS:
        required: false

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      attestations: read
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Backstop only (see #1220); generous vs. real deploy/stabilization times.
    timeout-minutes: 90
    environment: ${{ inputs.github_environment }}
    # Compatibility code remains available for rollback during migration, but
    # it is not an active consumer beside EKS.
    env:
      AWS_REGION: us-east-2
      ENV: ${{ inputs.environment }}
      PS_PREFIX: /shifter/${{ inputs.environment }}/portal
      INSTANCE_TAG: ${{ inputs.environment }}-portal-ec2
      PLATFORM_BOOTSTRAP_STAFF_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_STAFF_EMAILS }}
      PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Verify portal image build provenance
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          ECR_REPOSITORY: ${{ inputs.environment == 'prod' && 'shifter-portal' || format('shifter-{0}-portal', inputs.environment) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # ADR-037-R6: verify the OIDC-signed provenance attestation for the
          # exact portal image@digest and the fixed Brad-Edwards/shifter identity
          # before the digest is promoted to Parameter Store and rolled out.
          # No bypass mode.
          if [[ -z "$IMAGE_DIGEST" || ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not produce a valid ECR image digest to verify"
            exit 1
          fi
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_REF="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          echo "Verifying provenance for ${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          gh attestation verify "oci://${IMAGE_REF}" --repo Brad-Edwards/shifter

      - name: Render Terraform backend configs
        working-directory: ${{ github.workspace }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
          TF_INFRA_STATE_BUCKET_PROD: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_DEV"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_DEV}"
              ;;
            proof)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_PROOF"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROOF}"
              ;;
            prod)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROD}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${STATE_BUCKET}" ]; then
            echo "::error::Required secret ${BUCKET_SECRET_NAME} is not set for the ${ENVIRONMENT} Terraform backend"
            exit 1
          fi
          python3 scripts/terraform/render_aws_backend_configs.py \
            --bucket "${STATE_BUCKET}" \
            --env "${ENV}" \
            --stack portal \
            --github-env

      - name: Get deployment config
        id: config
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/portal_deploy/portal_deploy.py" resolve-topology \
            --terraform-dir "${GITHUB_WORKSPACE}/platform/terraform/environments/${ENV}/portal" \
            --backend-config "${SHIFTER_BACKEND_CONFIG_PATH}" \
            --instance-tag "$INSTANCE_TAG" \
            --github-output "$GITHUB_OUTPUT"

      - name: Update Parameter Store with new image digest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          if [[ -z "$IMAGE_DIGEST" || ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not produce a valid ECR image digest"
            exit 1
          fi
          echo "Updating Parameter Store with image digest: ${IMAGE_DIGEST}"
          aws ssm put-parameter \
            --name "${PS_PREFIX}/image-digest" \
            --value "${IMAGE_DIGEST}" \
            --type String \
            --overwrite
          aws ssm put-parameter \
            --name "${PS_PREFIX}/image-tag" \
            --value "${IMAGE_TAG}" \
            --type String \
            --overwrite
          echo "Parameter Store updated successfully"

      - name: Update bootstrap admin parameters
        run: |
          sync_optional_secure_param() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              aws ssm put-parameter \
                --name "$name" \
                --value "$value" \
                --type SecureString \
                --overwrite
            else
              aws ssm delete-parameter --name "$name" 2>/dev/null || true
            fi
          }

          sync_optional_secure_param "${PS_PREFIX}/platform-bootstrap-staff-emails" "${PLATFORM_BOOTSTRAP_STAFF_EMAILS}"
          sync_optional_secure_param "${PS_PREFIX}/platform-bootstrap-superuser-emails" "${PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS}"

      - name: Get Instance ID (single instance mode)
        id: instance
        if: steps.config.outputs.enable_autoscaling != 'true'
        run: |
          INSTANCE_ID="${{ steps.config.outputs.instance_id }}"
          if [ -z "$INSTANCE_ID" ]; then
            echo "::error::Terraform resolved single-instance mode but did not return an instance id"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Get ASG Name (ASG mode)
        id: asg
        if: steps.config.outputs.enable_autoscaling == 'true'
        run: |
          ASG_NAME="${{ steps.config.outputs.asg_name }}"
          if [ -z "$ASG_NAME" ]; then
            echo "::error::Terraform resolved ASG mode but did not return an ASG name"
            exit 1
          fi
          echo "asg_name=$ASG_NAME" >> "$GITHUB_OUTPUT"

      - name: Run database migrations (ASG mode)
        if: steps.config.outputs.enable_autoscaling == 'true'
        env:
          ASG_NAME: ${{ steps.asg.outputs.asg_name }}
        run: |
          echo "Selecting one in-service ASG instance for deploy-owned migration: $ASG_NAME"
          # On a first deploy to a fresh ASG there is no pre-existing in-service
          # instance: the newly-applied instances must launch, pull the image by
          # digest, bootstrap, and reach LifecycleState=InService. Poll for one
          # to appear instead of a one-shot check, which races and fails on a
          # cold ASG when run seconds after the image-digest param is updated.
          MIGRATION_INSTANCE_WAIT_SECONDS=600
          MIGRATION_INSTANCE_POLL_SECONDS=15
          MIGRATION_INSTANCE_ID=""
          for i in $(seq 1 $((MIGRATION_INSTANCE_WAIT_SECONDS / MIGRATION_INSTANCE_POLL_SECONDS))); do
            MIGRATION_INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService' && HealthStatus=='Healthy'] | [0].InstanceId" \
              --output text)
            if [ -n "$MIGRATION_INSTANCE_ID" ] && [ "$MIGRATION_INSTANCE_ID" != "None" ]; then
              break
            fi
            echo "Attempt $i: No in-service instance yet in ASG $ASG_NAME; waiting..."
            sleep "$MIGRATION_INSTANCE_POLL_SECONDS"
          done

          if [ -z "$MIGRATION_INSTANCE_ID" ] || [ "$MIGRATION_INSTANCE_ID" = "None" ]; then
            echo "::error::No healthy in-service instance found in ASG $ASG_NAME for database migration after ${MIGRATION_INSTANCE_WAIT_SECONDS}s"
            exit 1
          fi

          echo "Running migration on instance: $MIGRATION_INSTANCE_ID"

          # Wait for cloud-init to complete so Docker and the ECR credential helper are available.
          for i in $(seq 1 30); do
            RESULT=$(aws ssm send-command --document-name "AWS-RunShellScript" --instance-ids "$MIGRATION_INSTANCE_ID" \
              --parameters 'commands=["cloud-init status --wait || cloud-init status"]' \
              --query "Command.CommandId" --output text 2>/dev/null) || true
            if [ -n "$RESULT" ]; then
              sleep 10
              STATUS=$(aws ssm get-command-invocation --command-id "$RESULT" --instance-id "$MIGRATION_INSTANCE_ID" \
                --query "StandardOutputContent" --output text 2>/dev/null) || true
              if echo "$STATUS" | grep -q "done"; then echo "Cloud-init complete"; break; fi
            fi
            echo "Attempt $i: Waiting for cloud-init..."; sleep 10
          done

          DEPLOY_SCRIPT_PATH="${GITHUB_WORKSPACE}/scripts/portal-deploy/deploy_portal.sh"
          DEPLOY_SCRIPT_B64=$(base64 -w0 "$DEPLOY_SCRIPT_PATH")
          DEPLOY_ARGS=$(jq -cn \
            --arg awsRegion "$AWS_REGION" \
            --arg psPrefix "$PS_PREFIX" \
            '[
              "--aws-region", $awsRegion,
              "--ps-prefix", $psPrefix,
              "--migrate-only"
            ]')

          PARAMS_FILE=$(mktemp)
          jq -n \
            --arg deployScriptB64 "$DEPLOY_SCRIPT_B64" \
            --argjson deployArgs "$DEPLOY_ARGS" \
            '{
              commands: [
                ("printf %s " + ($deployScriptB64 | @sh) + " | base64 -d > /tmp/shifter-deploy-portal.sh"),
                "chmod 0755 /tmp/shifter-deploy-portal.sh",
                ((["/tmp/shifter-deploy-portal.sh"] + $deployArgs) | @sh)
              ]
            }' > "$PARAMS_FILE"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$MIGRATION_INSTANCE_ID" \
            --parameters "file://$PARAMS_FILE" \
            --timeout-seconds 900 \
            --query "Command.CommandId" --output text)

          rm -f "$PARAMS_FILE"

          echo "Migration SSM Command ID: $COMMAND_ID"
          # `aws ssm wait command-executed` is a fixed ~100s waiter (20x5s);
          # --cli-*-timeout are per-HTTP-call, not the total wait. The migrate
          # command docker-pulls the new image first, which on a cold instance
          # exceeds 100s, so the waiter times out even though the command has a
          # 900s budget and succeeds. Poll to the command budget instead (#1410).
          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$MIGRATION_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|TimeoutExceeded) break ;;
            esac
            sleep 15
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Migration failed (status=$STATUS)!"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$MIGRATION_INSTANCE_ID" --query "StandardErrorContent" --output text || true
            exit 1
          fi
          echo "Database migration completed successfully."

      - name: Deploy via SSM (single instance mode)
        if: steps.config.outputs.enable_autoscaling != 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          echo "Deploying to single instance: $INSTANCE_ID"

          # Wait for cloud-init to complete
          for i in $(seq 1 30); do
            RESULT=$(aws ssm send-command --document-name "AWS-RunShellScript" --instance-ids "$INSTANCE_ID" \
              --parameters 'commands=["cloud-init status --wait || cloud-init status"]' \
              --query "Command.CommandId" --output text 2>/dev/null) || true
            if [ -n "$RESULT" ]; then
              sleep 10
              STATUS=$(aws ssm get-command-invocation --command-id "$RESULT" --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text 2>/dev/null) || true
              if echo "$STATUS" | grep -q "done"; then echo "Cloud-init complete"; break; fi
            fi
            echo "Attempt $i: Waiting for cloud-init..."; sleep 10
          done

          # Deploy script reads config from Parameter Store and restarts containers.
          DEPLOY_SCRIPT_PATH="${GITHUB_WORKSPACE}/scripts/portal-deploy/deploy_portal.sh"
          DEPLOY_SCRIPT_B64=$(base64 -w0 "$DEPLOY_SCRIPT_PATH")

          # Worker-container health supervisor (#953) artifacts stay single-sourced
          # under modules/portal/ec2/worker-health and are injected base64-encoded
          # so both AWS deploy paths install byte-identical files.
          WH_DIR="${GITHUB_WORKSPACE}/platform/terraform/modules/portal/ec2/worker-health"
          WH_MONITOR_B64=$(base64 -w0 "$WH_DIR/shifter-worker-health.sh")
          WH_SERVICE_B64=$(base64 -w0 "$WH_DIR/shifter-worker-health.service")
          WH_TIMER_B64=$(base64 -w0 "$WH_DIR/shifter-worker-health.timer")
          # name_prefix is "<environment>-portal"; matches the Terraform alarm dimension.
          WH_NAME_PREFIX="$ENV-portal"

          DEPLOY_ARGS=$(jq -cn \
            --arg awsRegion "$AWS_REGION" \
            --arg psPrefix "$PS_PREFIX" \
            --arg whMonitorB64 "$WH_MONITOR_B64" \
            --arg whServiceB64 "$WH_SERVICE_B64" \
            --arg whTimerB64 "$WH_TIMER_B64" \
            --arg whNamePrefix "$WH_NAME_PREFIX" \
            '[
              "--aws-region", $awsRegion,
              "--ps-prefix", $psPrefix,
              "--worker-health-monitor-b64", $whMonitorB64,
              "--worker-health-service-b64", $whServiceB64,
              "--worker-health-timer-b64", $whTimerB64,
              "--worker-health-name-prefix", $whNamePrefix
            ]')

          # Run deploy via SSM using temp file to avoid quoting issues
          PARAMS_FILE=$(mktemp)
          jq -n \
            --arg deployScriptB64 "$DEPLOY_SCRIPT_B64" \
            --argjson deployArgs "$DEPLOY_ARGS" \
            '{
              commands: [
                ("printf %s " + ($deployScriptB64 | @sh) + " | base64 -d > /tmp/shifter-deploy-portal.sh"),
                "chmod 0755 /tmp/shifter-deploy-portal.sh",
                ((["/tmp/shifter-deploy-portal.sh"] + $deployArgs) | @sh)
              ]
            }' > "$PARAMS_FILE"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters "file://$PARAMS_FILE" \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text)

          rm -f "$PARAMS_FILE"

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment (timeout: 15 minutes)..."
          SECONDS_WAITED=0
          TIMEOUT=900
          while true; do
            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --cli-read-timeout 30 \
              --cli-connect-timeout 30 && break
            SECONDS_WAITED=$((SECONDS_WAITED + 100))
            if [ $SECONDS_WAITED -ge $TIMEOUT ]; then
              echo "Waiter timed out after ${TIMEOUT}s"
              break
            fi
            echo "Still waiting... (~${SECONDS_WAITED}s elapsed)"
          done
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed!"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
            exit 1
          fi
          echo "Platform deployment successful!"

      - name: Trigger ASG instance refresh
        # Only cycle the portal fleet when the portal actually changed (issue
        # #1639): a new portal image (portal_image_changes) or a platform
        # Terraform change that can alter the launch template / user_data
        # (platform_changes). An engine-provisioner-only deploy does not change
        # the portal host, so paying the ~40-minute rolling refresh on it is pure
        # iteration-loop waste. New instances still read the current image digest
        # from Parameter Store at boot, so a skipped refresh never serves a stale
        # image for a portal that did not change.
        if: >-
          steps.config.outputs.enable_autoscaling == 'true' &&
          (inputs.portal_image_changes || inputs.platform_changes)
        env:
          ASG_NAME: ${{ steps.asg.outputs.asg_name }}
        run: |
          echo "Triggering instance refresh for ASG: $ASG_NAME"

          # Check if there's already an instance refresh in progress
          ACTIVE_REFRESH=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "InstanceRefreshes[?Status=='InProgress' || Status=='Pending'].InstanceRefreshId | [0]" \
            --output text)

          if [ "$ACTIVE_REFRESH" != "None" ] && [ -n "$ACTIVE_REFRESH" ]; then
            echo "Instance refresh already in progress: $ACTIVE_REFRESH"
            echo "Waiting for it to complete..."
          else
            # Start instance refresh
            # New instances read the updated image digest from Parameter Store via user_data.
            # Lifecycle hook ensures instance is ready before joining ALB.
            # InstanceWarmup is 120s: bootstrap completes the launch hook in ~90s
            # and the ALB target-group health check gates real traffic, so a
            # shorter warmup keeps a full (in-service + warm-pool) refresh inside
            # the poll window without cutting availability (MinHealthyPercentage
            # still holds 50% in service).
            REFRESH_ID=$(aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$ASG_NAME" \
              --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}' \
              --query "InstanceRefreshId" --output text)

            echo "Instance refresh started: $REFRESH_ID"
            ACTIVE_REFRESH=$REFRESH_ID
          fi

          # Wait for instance refresh to complete
          echo "Waiting for instance refresh to complete..."
          RETRIES=0
          # A full refresh covers in-service + warm-pool instances (12 in dev),
          # each with warmup plus per-instance termination drain, so it runs
          # well beyond the original 30-minute cap. Combined with the reduced
          # InstanceWarmup above, 60 minutes gives headroom for the full set.
          MAX_RETRIES=120  # 60 minutes max wait
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$ACTIVE_REFRESH" \
              --query "InstanceRefreshes[0].Status" --output text)

            echo "Instance refresh status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Instance refresh completed successfully!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Instance refresh failed or was cancelled!"
              aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$ASG_NAME" \
                --instance-refresh-ids "$ACTIVE_REFRESH" \
                --query "InstanceRefreshes[0].StatusReason" --output text
              exit 1
            fi

            RETRIES=$((RETRIES + 1))
            if [ $RETRIES -gt $MAX_RETRIES ]; then
              echo "Timeout waiting for instance refresh"
              exit 1
            fi

            sleep 30
          done

          echo "Platform ASG deployment successful!"

      - name: Verify ASG image digest
        if: steps.config.outputs.enable_autoscaling == 'true'
        env:
          ASG_NAME: ${{ steps.asg.outputs.asg_name }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/portal_deploy/portal_deploy.py" verify-asg-image \
            --asg-name "$ASG_NAME" \
            --image-digest "$IMAGE_DIGEST"

      - name: Verify ASG worker health
        if: steps.config.outputs.enable_autoscaling == 'true'
        env:
          ASG_NAME: ${{ steps.asg.outputs.asg_name }}
        # Gate the deploy on worker/scheduler container health: the image-digest
        # and ALB /health/ checks only cover the portal web tier, so crash-looping
        # workers would otherwise ship green (#1398). Retries internally to
        # tolerate the health-start-period and a single transient restart.
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/portal_deploy/portal_deploy.py" verify-asg-workers \
            --asg-name "$ASG_NAME"
