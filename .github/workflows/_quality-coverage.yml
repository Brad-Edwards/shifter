name: Quality - coverage

on:
  workflow_call:
    inputs:
      skip_tests:
        required: false
        type: boolean
        default: false
      run_all:
        required: false
        type: string
        default: "false"
      shifter_platform:
        required: false
        type: string
        default: "false"
      cyberscript:
        required: false
        type: string
        default: "false"
      check_layer_imports:
        required: false
        type: string
        default: "false"
      provisioner:
        required: false
        type: string
        default: "false"
      bootstrap:
        required: false
        type: string
        default: "false"
      installation:
        required: false
        type: string
        default: "false"
      run_sonar:
        required: false
        type: string
        default: "false"
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  shifter-platform-lint:
    permissions:
      contents: read
    name: Lint (shifter_platform)
    if: ${{ (inputs.run_all == 'true' || inputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Lint Python
        working-directory: shifter/shifter_platform
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check for missing migrations
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run python manage.py makemigrations --check --dry-run

  shifter-platform-lint-js:
    permissions:
      contents: read
    name: Lint JavaScript/CSS (shifter_platform)
    if: ${{ (inputs.run_all == 'true' || inputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: shifter/shifter_platform/package-lock.json

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: npm ci

      - name: Lint JavaScript
        working-directory: shifter/shifter_platform
        run: npx eslint static/js/

      - name: Lint CSS
        working-directory: shifter/shifter_platform
        run: npx stylelint static/css/

  shifter-platform-spa:
    permissions:
      contents: read
    name: SPA (shifter_platform frontend)
    if: ${{ (inputs.run_all == 'true' || inputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: shifter/shifter_platform/frontend/package-lock.json

      - name: Install dependencies
        working-directory: shifter/shifter_platform/frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: shifter/shifter_platform/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: shifter/shifter_platform/frontend
        run: npm run typecheck

      - name: Unit tests (Vitest + axe)
        working-directory: shifter/shifter_platform/frontend
        run: npm run test:coverage

      - name: Build (Vite)
        working-directory: shifter/shifter_platform/frontend
        run: npm run build

  # ===========================================================================
  # /api/v1/ OpenAPI contract gates (#1329, ADR-040)
  #
  # Drift gate: a fresh, hermetic generation must match the committed artifact.
  # SPA-types gate: schema.d.ts must be the artifact's generated projection.
  # Breaking-change gate: the committed artifact must not make consumer-breaking
  # changes to /api/v1/ versus the base branch's already-published artifact
  # (trusted base SHA, never a baseline this PR can rewrite). Compatibility
  # semantics come from a pinned OpenAPI-aware checker (oasdiff), not ad hoc
  # shell. Read-only permissions, no cloud, no database.
  # ===========================================================================

  shifter-platform-api-contract:
    permissions:
      contents: read
    name: API contract (shifter_platform)
    if: ${{ (inputs.run_all == 'true' || inputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: "1.23.0"
      OASDIFF_SHA256: "972b10535c3db4366b9dc3ebc11ca021279af3095267c3cffdca854a3a3c4f89"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Base-branch history is required for the breaking-change comparison.
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: shifter/shifter_platform/frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Install frontend dependencies
        working-directory: shifter/shifter_platform/frontend
        run: npm ci

      - name: Drift gate (committed artifact matches DRF surface)
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run python manage.py api_contract --check

      - name: SPA types match the committed contract
        working-directory: shifter/shifter_platform/frontend
        run: |
          npx openapi-typescript ../openapi/v1.json -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts

      - name: Install oasdiff (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  /tmp/oasdiff.tar.gz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tar.gz -C /usr/local/bin oasdiff
          oasdiff --version

      - name: Breaking-change gate (vs base branch contract)
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run python manage.py api_contract --breaking-against "${BASE_SHA}"

  shifter-platform-typecheck:
    permissions:
      contents: read
    name: Type Check (shifter_platform)
    if: ${{ (inputs.run_all == 'true' || inputs.shifter_platform == 'true' || inputs.cyberscript == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Run mypy
        working-directory: shifter/shifter_platform
        # The django-stubs mypy plugin imports `config.settings` to construct
        # itself, so the run needs synthetic, non-production Django env
        # (matching the `mypy-shifter-platform` pre-commit hook) or the plugin
        # raises and mypy exits with an INTERNAL ERROR. PYTHONPATH=".." makes
        # the imported `cyberscript` package resolvable at settings-import time.
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: dummy-for-testing
          PYTHONPATH: ".."
        run: uv run mypy .

  shifter-platform-sast:
    permissions:
      contents: read
    name: SAST (shifter_platform)
    if: ${{ (inputs.run_all == 'true' || inputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        run: |
          uv tool install bandit
          bandit -r shifter/shifter_platform/ --skip B101 --exclude shifter/shifter_platform/tests,shifter/shifter_platform/.venv

  shifter-platform-tests:
    permissions:
      contents: read
    name: Tests (shifter_platform)
    needs: [shifter-platform-lint, shifter-platform-lint-js, shifter-platform-sast]
    if: ${{ !inputs.skip_tests && ((inputs.run_all == 'true' || inputs.shifter_platform == 'true')) }}
    runs-on: ubuntu-latest
    services:
      # Redis backs the real-stack ASGI/Channels integration evidence (#924).
      # It is consumed only by the dedicated redis-posture step below; the main
      # test step stays on the in-memory channel layer (no REDIS_HOST), so the
      # default test ergonomics are unchanged. The production-semantics
      # PostgreSQL backend now lives in the dedicated shifter-platform-tests-postgres
      # job (#1524); this SQLite job carries no PostgreSQL service or DB_* bundle.
      redis:
        image: redis:7.4.9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Run tests
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          # Explicit SQLite selection (#1524): the fast lane and the sole
          # coverage publisher. PostgreSQL semantics are proven by the dedicated
          # shifter-platform-tests-postgres job, so no DB_* bundle here.
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          uv run python manage.py collectstatic --noinput
          # ``--cov`` (no path) measures the production roots declared in
          # pyproject ``[tool.coverage.run] source`` and honours its ``omit`` +
          # ``fail_under`` (#1529 / REV1 Q6): config, not the command line, owns
          # the coverage universe and the non-regression floor. ``tests/`` runs in
          # full: the former ``--ignore=tests/documentation`` was dropped when the
          # Django docs app and its suite were retired (#1591), so no path is
          # excluded here.
          uv run pytest tests/ -m "not redis and not postgres" --cov --cov-report=term-missing --cov-report=xml:coverage.xml

      # Real-stack Redis channel-layer evidence (#924). Runs only the
      # redis-marked integration tests against the Redis service, with xdist
      # disabled (-n0) for deterministic stateful isolation. CHANNEL_LAYER_BACKEND
      # / REDIS_HOST are scoped to this step, so the main suite above stays
      # in-memory.
      - name: Run Redis channel-layer integration tests
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          # Redis posture is a channel-layer service, not a database backend:
          # these tests run against SQLite explicitly (#1524), no DB_* bundle.
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          CHANNEL_LAYER_BACKEND: redis
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: |
          uv run pytest tests/integration/asgi -m redis -n0 -p no:cacheprovider

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shifter-platform
          path: shifter/shifter_platform/coverage.xml
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # PostgreSQL semantics lane (#1524)
  #
  # Runs the broad shifter_platform application suite against a real PostgreSQL
  # backend so production persistence semantics (transactions, model/DB
  # constraints, select_for_update / skip_locked, and the Range subnet-index
  # LOCK TABLE ... IN EXCLUSIVE MODE branch) are exercised for real — the
  # SQLite lane above cannot prove them. TEST_DB_BACKEND=postgres selects the
  # stock PostgreSQL backend via config._database_settings; pytest-django owns
  # the per-worker test-database lifecycle (no manual CREATE DATABASE / migrate).
  # This runs in parallel with the SQLite job (its own service, its own cost)
  # and is NOT a second coverage publisher — the SQLite job remains the sole
  # coverage source. It is required through the reusable-workflow -> PR Gate
  # chain: a failure here fails `quality`, which fails the PR Gate.
  # ===========================================================================

  shifter-platform-tests-postgres:
    permissions:
      contents: read
    name: Tests (shifter_platform, PostgreSQL)
    needs: [shifter-platform-lint, shifter-platform-sast]
    if: ${{ !inputs.skip_tests && ((inputs.run_all == 'true' || inputs.shifter_platform == 'true')) }}
    runs-on: ubuntu-latest
    # Generous first-run headroom; tune from the STEP_SUMMARY runtime once the
    # lane has representative history (#1524).
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shifter
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      # Broad application scope against real PostgreSQL, excluding tests owned by
      # another real service posture (redis) and the separately-tracked
      # documentation suite. No --cov: the SQLite job publishes coverage. The
      # root-conftest fail-closed marker guard asserts >=1 postgres-marked test
      # is collected and fails on any skipped postgres-marked test; the vendor
      # test asserts Django resolved to PostgreSQL from inside the process.
      - name: Run application suite against PostgreSQL
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: postgres
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: shifter
          DB_USER: test
          DB_PASSWORD: test
        run: |
          uv run python manage.py collectstatic --noinput
          start=$(date +%s)
          set +e
          uv run pytest tests/ -m "not redis" \
            --junit-xml=postgres-junit.xml -p no:cacheprovider
          status=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          # Structured runtime/cost + counts from JUnit (not a grep of pytest
          # prose), appended to the job summary. Never prints secrets.
          python3 - "$elapsed" postgres-junit.xml <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          elapsed = int(sys.argv[1])
          suites = ET.parse(sys.argv[2]).getroot().findall("testsuite") or [ET.parse(sys.argv[2]).getroot()]
          tests = sum(int(s.get("tests", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          passed = tests - failures - errors - skipped
          lines = [
              "## PostgreSQL semantics lane (#1524)",
              "- backend: postgresql (image pin: postgres:16)",
              f"- collected: {tests}  passed: {passed}  failed: {failures}  errors: {errors}  skipped: {skipped}",
              f"- elapsed: {elapsed // 60}m{elapsed % 60:02d}s (~{elapsed / 60:.1f} hosted-runner minutes)",
          ]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          exit "$status"

      - name: Upload PostgreSQL lane JUnit (failure evidence)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-lane-junit
          path: shifter/shifter_platform/postgres-junit.xml
          if-no-files-found: warn
          retention-days: 1

  shifter-platform-js-tests:
    permissions:
      contents: read
    name: Tests JavaScript (shifter_platform)
    needs: shifter-platform-lint-js
    if: ${{ !inputs.skip_tests && ((inputs.run_all == 'true' || inputs.shifter_platform == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: shifter/shifter_platform/package-lock.json

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: npm ci

      - name: Run JavaScript tests
        working-directory: shifter/shifter_platform
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shifter-platform-js
          path: shifter/shifter_platform/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  migration-proof-tests:
    permissions:
      contents: read
    name: Tests (migration proof)
    needs: [shifter-platform-lint, shifter-platform-sast]
    if: ${{ !inputs.skip_tests && ((inputs.run_all == 'true' || inputs.shifter_platform == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Run migration proof
        working-directory: shifter/shifter_platform
        run: uv run pytest engine/tests/test_subnet_allocation_migrations_postgres.py

  model-fks-arch:
    permissions:
      contents: read
    name: Architecture (model FKs)
    if: ${{ (inputs.run_all == 'true' || inputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      # check_model_fks introspects Django model metadata only — it never opens a
      # database connection. Explicit SQLite selection (#1524), no PostgreSQL
      # service or DB_* bundle (the previous postgres:16 service sat idle).
      - name: Check model FKs
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run python manage.py check_model_fks

  # ===========================================================================
  # Built-image stack smoke (#922)
  #
  # Boots the *production* portal image under its real entrypoint.sh against
  # local Postgres / Redis / ElasticMQ doubles and asserts /health readiness,
  # an authenticated websocket handshake, and worker/scheduler heartbeats. This
  # catches container-runtime regressions (the June-7 /home/appuser and worker
  # healthcheck failures) that the source-tree pytest estate cannot see. Gated
  # on `run_stack_smoke`, which the caller drives from the portal_image /
  # shifter_platform path filters, so it only builds the image when the image's
  # inputs change. Hosted runner, no cloud credentials.
  # ===========================================================================

  check-layer-imports-arch:
    permissions:
      contents: read
    name: Architecture (layer imports)
    if: ${{ (inputs.run_all == 'true' || inputs.check_layer_imports == 'true' || inputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: scripts/check_layer_imports
        run: uv sync

      - name: Check layer imports
        working-directory: scripts/check_layer_imports
        run: uv run python check_layer_imports.py

  import-linter-arch:
    permissions:
      contents: read
    name: Architecture (import linter)
    if: ${{ (inputs.run_all == 'true' || inputs.shifter_platform == 'true' || inputs.check_layer_imports == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Check import contracts
        working-directory: shifter/shifter_platform
        run: uv run lint-imports --config ../../.importlinter

  # ===========================================================================
  # SAST (Bandit)
  #
  # Policy (#1193): every Bandit job in this workflow is BLOCKING. There
  # are no advisory Bandit jobs by default. Owner: @Brad-Edwards. Scope
  # covers every Python package that ships from this repo — runtime
  # (shifter_platform, provisioner), build (packer), bootstrap and
  # install scripts (scripts/bootstrap, shifter/installation), operator
  # scripts (scripts/gcp), and dev-tool linters
  # (scripts/check_layer_imports). Adding a new Bandit job MUST NOT
  # introduce `continue-on-error: true` — fix the finding, narrow the
  # scan, or use a documented `# nosec` with an inline justification.
  # ===========================================================================

  provisioner-lint:
    permissions:
      contents: read
    name: Lint (provisioner)
    if: ${{ (inputs.run_all == 'true' || inputs.provisioner == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: shifter/engine/provisioner
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  provisioner-typecheck:
    permissions:
      contents: read
    name: Type Check (provisioner)
    if: ${{ (inputs.run_all == 'true' || inputs.provisioner == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/engine/provisioner
        run: uv sync --group dev

      - name: Run mypy
        working-directory: shifter/engine/provisioner
        run: uv run mypy .

  # ===========================================================================
  # Architecture as Code (hard fail - zero tolerance)
  # ===========================================================================

  provisioner-sast:
    permissions:
      contents: read
    name: SAST (provisioner)
    if: ${{ (inputs.run_all == 'true' || inputs.provisioner == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        # B404: subprocess import, B603: subprocess call, B607: partial path
        # Provisioner uses subprocess for Pulumi CLI calls with hardcoded commands
        run: |
          uv tool install bandit
          bandit -r shifter/engine/provisioner/ --skip B101,B404,B603,B607 --exclude shifter/engine/provisioner/tests,shifter/engine/provisioner/.venv

  shifter-engine-tests:
    permissions:
      contents: read
    name: Tests (provisioner)
    needs: [provisioner-lint, provisioner-sast]
    if: ${{ !inputs.skip_tests && ((inputs.run_all == 'true' || inputs.provisioner == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/engine/provisioner
        run: uv sync --group dev

      - name: Run tests
        working-directory: shifter/engine/provisioner
        env:
          TESTING: "1"
        run: uv run --with pytest-cov pytest tests/ --cov --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-provisioner
          path: shifter/engine/provisioner/coverage.xml
          if-no-files-found: error
          retention-days: 1

  bootstrap-lint:
    permissions:
      contents: read
    name: Lint (bootstrap)
    if: ${{ (inputs.run_all == 'true' || inputs.bootstrap == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: scripts/bootstrap
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  bootstrap-sast:
    permissions:
      contents: read
    name: SAST (bootstrap)
    if: ${{ (inputs.run_all == 'true' || inputs.bootstrap == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        run: |
          uv tool install bandit
          bandit -r scripts/bootstrap/ --skip B101 --exclude scripts/bootstrap/tests,scripts/bootstrap/.venv

  bootstrap-tests:
    permissions:
      contents: read
    name: Tests (bootstrap)
    needs: bootstrap-lint
    if: ${{ !inputs.skip_tests && ((inputs.run_all == 'true' || inputs.bootstrap == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: scripts/bootstrap
        run: uv sync --group dev

      - name: Run tests
        working-directory: scripts/bootstrap
        run: uv run --with pytest-cov pytest tests/ --cov --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-bootstrap
          path: scripts/bootstrap/coverage.xml
          if-no-files-found: error
          retention-days: 1

  check-layer-imports-lint:
    permissions:
      contents: read
    name: Lint (check_layer_imports)
    if: ${{ (inputs.run_all == 'true' || inputs.check_layer_imports == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: scripts/check_layer_imports
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  check-layer-imports-sast:
    permissions:
      contents: read
    name: SAST (check_layer_imports)
    if: ${{ (inputs.run_all == 'true' || inputs.check_layer_imports == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        working-directory: scripts/check_layer_imports
        run: |
          uv tool install 'bandit[toml]'
          bandit -r . -c pyproject.toml

  check-layer-imports-tests:
    permissions:
      contents: read
    name: Tests (check_layer_imports)
    needs: check-layer-imports-lint
    if: ${{ !inputs.skip_tests && ((inputs.run_all == 'true' || inputs.check_layer_imports == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: scripts/check_layer_imports
        run: uv sync --group dev

      - name: Run tests
        working-directory: scripts/check_layer_imports
        run: uv run --with pytest-cov pytest tests/ --cov --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-check-layer-imports
          path: scripts/check_layer_imports/coverage.xml
          if-no-files-found: error
          retention-days: 1

  installation-lint:
    permissions:
      contents: read
    name: Lint (installation)
    if: ${{ (inputs.run_all == 'true' || inputs.installation == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: shifter/installation
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  installation-sast:
    permissions:
      contents: read
    name: SAST (installation)
    if: ${{ (inputs.run_all == 'true' || inputs.installation == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        run: |
          uv tool install bandit
          bandit -r shifter/installation/ --skip B101 --exclude shifter/installation/tests,shifter/installation/.venv

  installation-tests:
    permissions:
      contents: read
    name: Tests (installation)
    needs: installation-lint
    if: ${{ !inputs.skip_tests && ((inputs.run_all == 'true' || inputs.installation == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/installation
        run: uv sync --group dev

      - name: Run tests
        working-directory: shifter/installation
        run: uv run --with pytest-cov pytest tests/ --cov --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-installation
          path: shifter/installation/coverage.xml
          if-no-files-found: error
          retention-days: 1

  sonarcloud:
    permissions:
      contents: read
    name: SonarCloud
    # Runs after the test jobs so their coverage reports can feed the scan.
    # success() keeps the implicit needs-passed guard that a custom if:
    # would otherwise drop; skipped when tests are skipped.
    if: ${{ always() && !cancelled() && !inputs.skip_tests && inputs.run_sonar == 'true' }}
    needs: [shifter-platform-tests, shifter-platform-js-tests, shifter-engine-tests, bootstrap-tests, check-layer-imports-tests, installation-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so SonarCloud attributes new code accurately for
          # pull-request (new-code) quality-gate analysis.
          fetch-depth: 0

      # Coverage reports are produced only by test jobs that ran for the
      # changed paths. Each download mirrors that job's path filter and
      # success result so a portal-only PR does not fail Sonar waiting for
      # skipped-job artifacts (issue #786).
      - name: Download shifter_platform coverage
        if: >-
          ${{ (inputs.run_all == 'true' || inputs.shifter_platform == 'true')
          && needs.shifter-platform-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-shifter-platform
          path: shifter/shifter_platform
      - name: Download shifter_platform JS coverage
        if: >-
          ${{ (inputs.run_all == 'true' || inputs.shifter_platform == 'true')
          && needs.shifter-platform-js-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-shifter-platform-js
          path: shifter/shifter_platform/coverage
      - name: Download provisioner coverage
        if: >-
          ${{ (inputs.run_all == 'true' || inputs.provisioner == 'true')
          && needs.shifter-engine-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-provisioner
          path: shifter/engine/provisioner
      - name: Download bootstrap coverage
        if: >-
          ${{ (inputs.run_all == 'true' || inputs.bootstrap == 'true')
          && needs.bootstrap-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-bootstrap
          path: scripts/bootstrap
      - name: Download check_layer_imports coverage
        if: >-
          ${{ (inputs.run_all == 'true' || inputs.check_layer_imports == 'true')
          && needs.check-layer-imports-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-check-layer-imports
          path: scripts/check_layer_imports
      - name: Download installation coverage
        if: >-
          ${{ (inputs.run_all == 'true' || inputs.installation == 'true')
          && needs.installation-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-installation
          path: shifter/installation

      - name: Setup Java for SonarScanner
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: SonarQube Cloud scan
        # Gated on repository identity, NOT on the variables below being set
        # (ADR-003-R7). `vars.SONAR_PROJECT_KEY != ''` would look equivalent but
        # makes a renamed or deleted variable skip the scan silently, taking the
        # SonarCloud quality gate out of PR Gate with everything still green. The
        # canonical repository therefore always attempts the scan and fails loud
        # on misconfiguration. Anyone else running this workflow on their own
        # copy skips it: SonarCloud is our tooling choice, not a dependency we
        # impose on people who cloned the repo.
        #
        # Fork-origin pull requests also skip. They run in the base repository's
        # context, so the identity test above passes, but GitHub withholds
        # secrets from them — the scan would fail on a missing SONAR_TOKEN and
        # hand an outside contributor a red check they have no way to fix.
        # Analysis for their code happens on the `dev` run after merge.
        if: >-
          ${{ github.repository == 'Brad-Edwards/shifter'
          && github.event.pull_request.head.repo.fork != true }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Project key and organization are repository configuration, supplied
          # from non-secret repository variables (the analysis token stays in
          # env: and never reaches argv). Sources, exclusions, suppressions, and
          # coverage report paths remain shared analysis configuration in the
          # repo-root sonar-project.properties. On pull requests, wait for the
          # SonarCloud quality gate so a failing new-code gate fails this job
          # (and, via the Quality caller, the PR Gate check). Branch runs (push
          # to dev) upload analysis without blocking on pre-existing debt.
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.scanner.skipJreProvisioning=true
            ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true' || '' }}
