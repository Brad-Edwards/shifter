name: Shifter Engine

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      is_dev:
        required: true
        type: boolean
      deploy_changes:
        required: true
        type: boolean
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_ARN_DEV:
        required: true
      AWS_ROLE_ARN_PROOF:
        required: false

env:
  AWS_REGION: us-east-2

jobs:
  validate:
    name: Validate (${{ inputs.environment }})
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build provisioner image locally
        run: docker build --no-cache -t shifter-engine-validate ./shifter/engine/provisioner

  build:
    name: Build (${{ inputs.environment }})
    runs-on: self-hosted
    needs: validate
    permissions:
      id-token: write
      contents: read
    if: inputs.deploy_changes && github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.sha.outputs.short }}
    env:
      ECR_REPOSITORY: shifter-${{ inputs.environment }}-pulumi-provisioner
    steps:
      - uses: actions/checkout@v4

      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./shifter/engine/provisioner
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.sha.outputs.short }}
          no-cache: true

  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: self-hosted
    permissions:
      id-token: write
    needs: build
    if: inputs.deploy_changes && github.event_name != 'pull_request'
    env:
      TASK_FAMILY: ${{ inputs.environment }}-portal-pulumi-provisioner
    steps:
      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          ECR_REPOSITORY: shifter-${{ inputs.environment }}-pulumi-provisioner
        run: |
          # Get AWS account ID
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          NEW_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          # Get current task definition (skip if doesn't exist yet - first deploy)
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "${TASK_FAMILY}" --query 'taskDefinition' 2>/dev/null) || {
            echo "::warning::Task definition ${TASK_FAMILY} does not exist yet. Skipping deploy - Platform terraform will create it."
            exit 0
          }

          # Update the image in container definitions
          NEW_CONTAINER_DEFS=$(echo "$TASK_DEF" | jq --arg IMAGE "$NEW_IMAGE" '.containerDefinitions[0].image = $IMAGE | .containerDefinitions')

          # Register new task definition revision
          aws ecs register-task-definition \
            --family "${TASK_FAMILY}" \
            --task-role-arn "$(echo "$TASK_DEF" | jq -r '.taskRoleArn')" \
            --execution-role-arn "$(echo "$TASK_DEF" | jq -r '.executionRoleArn')" \
            --network-mode "$(echo "$TASK_DEF" | jq -r '.networkMode')" \
            --container-definitions "$NEW_CONTAINER_DEFS" \
            --requires-compatibilities FARGATE \
            --cpu "$(echo "$TASK_DEF" | jq -r '.cpu')" \
            --memory "$(echo "$TASK_DEF" | jq -r '.memory')"

          echo "Registered new task definition with image: ${NEW_IMAGE}"
