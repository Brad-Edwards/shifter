name: Quality

on:
  workflow_call:
    inputs:
      skip_tests:
        description: 'Skip test jobs (linting still runs)'
        required: false
        type: boolean
        default: false
      run_full_matrix:
        description: >-
          Run every quality job regardless of path filters. Set by the caller
          for workflow_dispatch full-validation runs.
        required: false
        type: boolean
        default: false
      run_stack_smoke:
        description: >-
          Run the built-image stack-smoke job. Driven by the caller from the
          portal_image / shifter_platform path filters so it only builds and
          boots the portal image when the image's inputs change.
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud analysis token (sonarcloud job)'
        required: true

jobs:
  paths:
    permissions:
      contents: read
    name: Detect quality paths
    runs-on: ubuntu-latest
    outputs:
      # run_all folds in the independent guard_selfcheck sentinel (a
      # workflow-owned expression the PR's classifier cannot influence): any
      # change to the ownership contract / classifier / guard forces the FULL
      # matrix, so a tampered classifier cannot emit run_all=false to skip the
      # production lint / SAST / test jobs that would inspect its own payload
      # (#1530, ADR-004-R24 self-bypass prevention).
      run_all: ${{ steps.detect.outputs.run_all == 'true' || steps.selfcheck.outputs.guard_selfcheck == 'true' }}
      run_sonar: ${{ steps.detect.outputs.run_sonar }}
      ci_workflows: ${{ steps.detect.outputs.ci_workflows }}
      shifter_platform: ${{ steps.detect.outputs.shifter_platform }}
      provisioner: ${{ steps.detect.outputs.provisioner }}
      cyberscript: ${{ steps.detect.outputs.cyberscript }}
      packer: ${{ steps.detect.outputs.packer }}
      bootstrap: ${{ steps.detect.outputs.bootstrap }}
      gcp_scripts: ${{ steps.detect.outputs.gcp_scripts }}
      check_layer_imports: ${{ steps.detect.outputs.check_layer_imports }}
      check_rds_pending_modifications: ${{ steps.detect.outputs.check_rds_pending_modifications }}
      handle_sd_replacement: ${{ steps.detect.outputs.handle_sd_replacement }}
      assert_portal_inspection: ${{ steps.detect.outputs.assert_portal_inspection }}
      installation: ${{ steps.detect.outputs.installation }}
      event_load_harness: ${{ steps.detect.outputs.event_load_harness }}
      range_functional_smoke: ${{ steps.detect.outputs.range_functional_smoke }}
      terraform: ${{ steps.detect.outputs.terraform }}
      k8s: ${{ steps.detect.outputs.k8s }}
      mcp_ngfw: ${{ steps.detect.outputs.mcp_ngfw }}
      mcp_ops: ${{ steps.detect.outputs.mcp_ops }}
      mcp_planner: ${{ steps.detect.outputs.mcp_planner }}
      mcp_shared: ${{ steps.detect.outputs.mcp_shared }}
      adr_guard: ${{ steps.detect.outputs.adr_guard }}
      # Independent of the classifier (steps.selfcheck, not steps.detect): forces
      # the guard's own verification to run on any contract/classifier/guard-file
      # change so it cannot self-bypass (#1530, ADR-004-R24).
      guard_selfcheck: ${{ steps.selfcheck.outputs.guard_selfcheck }}
      ctfd_workshop: ${{ steps.detect.outputs.ctfd_workshop }}
      polaris_aws_range: ${{ steps.detect.outputs.polaris_aws_range }}
      polaris_tests: ${{ steps.detect.outputs.polaris_tests }}
      stack_smoke: ${{ steps.detect.outputs.stack_smoke }}
      # Build / deployment / runtime image owners (#1530). Reserved routing
      # outputs: no blocking job consumes them yet (gaps tracked by #1698), but
      # they are declared so the contract and workflow stay in sync.
      container_images: ${{ steps.detect.outputs.container_images }}
      charts: ${{ steps.detect.outputs.charts }}
      cloudformation: ${{ steps.detect.outputs.cloudformation }}
      branding_assets: ${{ steps.detect.outputs.branding_assets }}
      mcp_lint_any: ${{ steps.detect.outputs.mcp_lint_any }}
      mcp_test_any: ${{ steps.detect.outputs.mcp_test_any }}
      mcp_lint_packages: ${{ steps.detect.outputs.mcp_lint_packages }}
      mcp_test_packages: ${{ steps.detect.outputs.mcp_test_packages }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Classify changed paths
        id: detect
        env:
          RUN_FULL_MATRIX: ${{ inputs.run_full_matrix }}
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DIFF_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Fail-closed changed-path classification (#1530). The helper
          # validates the .github/quality-path-filters.yaml quality-ownership
          # contract and REJECTS an unclassified changed path before emitting
          # any job-selection output, so an unowned path can no longer slip
          # through with an empty matrix. It emits the same GITHUB_OUTPUT keys
          # the downstream jobs consume. Ownership completeness and routing
          # reachability of this contract are enforced by the
          # `quality-path-ownership` adr_guard check.
          uv run --python 3.11 --with 'pyyaml==6.0.2' \
            python3 scripts/quality_ownership/classify_paths.py

      - name: Detect quality-guard changes (independent of the classifier)
        id: selfcheck
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DIFF_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Self-bypass prevention (#1530, ADR-004-R24). This detection is
          # deliberately NOT sourced from scripts/quality_ownership/classify_paths.py:
          # it is a plain git diff in the workflow itself, so a PR that modifies
          # the classifier, the contract module, or the contract file to emit
          # adr_guard=false / run_all=false cannot suppress the very jobs that
          # verify those files. adr-conformance and adr-guard-tests OR this
          # output into their gate.
          base="${DIFF_BASE_SHA}"
          head="${DIFF_HEAD_SHA:-$GITHUB_SHA}"
          if [ -n "${base}" ] && [ "${base}" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "${base}...${head}")"
          else
            changed="$(git diff --name-only HEAD~1 HEAD)"
          fi
          selfcheck=false
          while IFS= read -r file; do
            case "${file}" in
              .github/quality-path-filters.yaml | scripts/quality_ownership/* | scripts/adr_guard/*)
                selfcheck=true
                ;;
            esac
          done <<< "${changed}"
          echo "guard_selfcheck=${selfcheck}" >> "${GITHUB_OUTPUT}"

  # ===========================================================================
  # Linting
  # ===========================================================================

  stack-smoke:
    permissions:
      contents: read
    name: Stack smoke (built image)
    needs: [paths]
    if: ${{ inputs.run_stack_smoke && !inputs.skip_tests && (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.stack_smoke == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Boot built portal image and assert health/WS/workers
        run: bash scripts/stack-smoke/stack_smoke.sh

  # ===========================================================================
  # Static analysis — SonarCloud
  # ===========================================================================

  coverage:
    uses: ./.github/workflows/_quality-coverage.yml
    needs: paths
    with:
      skip_tests: ${{ inputs.skip_tests }}
      run_all: ${{ needs.paths.outputs.run_all }}
      shifter_platform: ${{ needs.paths.outputs.shifter_platform }}
      cyberscript: ${{ needs.paths.outputs.cyberscript }}
      check_layer_imports: ${{ needs.paths.outputs.check_layer_imports }}
      provisioner: ${{ needs.paths.outputs.provisioner }}
      bootstrap: ${{ needs.paths.outputs.bootstrap }}
      installation: ${{ needs.paths.outputs.installation }}
      run_sonar: ${{ needs.paths.outputs.run_sonar }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  terraform:
    uses: ./.github/workflows/_quality-terraform.yml
    needs: paths
    with:
      run_all: ${{ needs.paths.outputs.run_all }}
      terraform: ${{ needs.paths.outputs.terraform }}

  k8s:
    uses: ./.github/workflows/_quality-k8s.yml
    needs: paths
    with:
      run_all: ${{ needs.paths.outputs.run_all }}
      k8s: ${{ needs.paths.outputs.k8s }}

  mcp:
    uses: ./.github/workflows/_quality-mcp.yml
    needs: paths
    with:
      skip_tests: ${{ inputs.skip_tests }}
      mcp_lint_any: ${{ needs.paths.outputs.mcp_lint_any }}
      mcp_lint_packages: ${{ needs.paths.outputs.mcp_lint_packages }}
      mcp_test_any: ${{ needs.paths.outputs.mcp_test_any }}
      mcp_test_packages: ${{ needs.paths.outputs.mcp_test_packages }}

  guard:
    uses: ./.github/workflows/_quality-guard.yml
    needs: paths
    with:
      skip_tests: ${{ inputs.skip_tests }}
      run_all: ${{ needs.paths.outputs.run_all }}
      adr_guard: ${{ needs.paths.outputs.adr_guard }}
      guard_selfcheck: ${{ needs.paths.outputs.guard_selfcheck }}
      ci_workflows: ${{ needs.paths.outputs.ci_workflows }}

  components:
    uses: ./.github/workflows/_quality-components.yml
    needs: paths
    with:
      skip_tests: ${{ inputs.skip_tests }}
      run_all: ${{ needs.paths.outputs.run_all }}
      ctfd_workshop: ${{ needs.paths.outputs.ctfd_workshop }}
      packer: ${{ needs.paths.outputs.packer }}
      gcp_scripts: ${{ needs.paths.outputs.gcp_scripts }}
      handle_sd_replacement: ${{ needs.paths.outputs.handle_sd_replacement }}
      check_rds_pending_modifications: ${{ needs.paths.outputs.check_rds_pending_modifications }}
      assert_portal_inspection: ${{ needs.paths.outputs.assert_portal_inspection }}
      event_load_harness: ${{ needs.paths.outputs.event_load_harness }}
      range_functional_smoke: ${{ needs.paths.outputs.range_functional_smoke }}
      cyberscript: ${{ needs.paths.outputs.cyberscript }}
      polaris_aws_range: ${{ needs.paths.outputs.polaris_aws_range }}
      polaris_tests: ${{ needs.paths.outputs.polaris_tests }}

  security-advisory:
    uses: ./.github/workflows/_quality-security-advisory.yml
    needs: paths
