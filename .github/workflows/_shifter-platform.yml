name: Platform

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      is_dev:
        required: true
        type: boolean
      apply_changes:
        required: true
        type: boolean
      # Split per concern (#913). `apply_changes` is deployment
      # permission (environment branch / manual dispatch); these two
      # say which paths actually changed. Terraform plan/apply and the
      # Guacamole image publish run only for platform_changes;
      # the portal image build/deploy runs for either signal.
      platform_changes:
        description: Terraform/platform-infrastructure inputs changed (or manual dispatch)
        required: true
        type: boolean
      portal_image_changes:
        description: Portal image source changed (or manual dispatch)
        required: true
        type: boolean
      engine_image_digest:
        description: Engine provisioner image digest from the upstream build job
        required: false
        type: string
        default: ""
      eks_enabled:
        description: Explicitly enable the EKS lifecycle after migration prerequisites are ready
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_ARN_DEV:
        required: true
      AWS_ROLE_ARN_PROOF:
        required: false
      PLATFORM_BOOTSTRAP_STAFF_EMAILS:
        required: false
      PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS:
        required: false
      # Whole-file local.auto.tfvars payload per environment. The committed
      # terraform.tfvars is an example.com baseline; the real per-deployment
      # values are rendered from these secrets before plan/apply. Declared
      # required: false — the render step fails loud when the active
      # environment's secret is empty. See docs/dev/deploy-secrets.md.
      TF_VARS_DEV_PORTAL:
        required: false
      TF_VARS_PROD_PORTAL:
        required: false
      TF_INFRA_STATE_BUCKET:
        required: false
      TF_INFRA_STATE_BUCKET_DEV:
        required: false
      TF_INFRA_STATE_BUCKET_PROOF:
        required: false
      TF_VARS_PROOF_PORTAL:
        required: false
      # Protected JSON inputs for the isolated EKS root. These include
      # provider-derived runtime references but never secret payloads.
      TF_VARS_DEV_EKS:
        required: false
      TF_VARS_PROOF_EKS:
        required: false
      TF_VARS_PROD_EKS:
        required: false
      # Per-environment deployment shifter.yaml (full root installation config).
      # The renderer-owned CLOUD_PROVIDER binding (PLAT-2005) is rendered from
      # this config's settings.backend, so it is the single source for the
      # deployed backend identity and must NOT also be carried in
      # TF_VARS_*_PORTAL. Declared required: false for the same dispatch-time
      # reason as TF_VARS_*; the render step fails loud for the active
      # environment. Reuses the same secrets _range.yml already declares.
      SHIFTER_CONFIG_DEV_RANGE:
        required: false
      SHIFTER_CONFIG_PROOF_RANGE:
        required: false
      SHIFTER_CONFIG_PROD_RANGE:
        required: false
      SMOKE_TEST_USER_EMAIL:
        required: false

jobs:
  plan:
    uses: ./.github/workflows/_platform-plan.yml
    needs: push-guacamole-images
    if: |
      inputs.apply_changes &&
      github.event_name != 'pull_request' &&
      inputs.environment == '__legacy-disabled__'
    with:
      environment: ${{ inputs.environment }}
      apply_changes: ${{ inputs.apply_changes }}
      engine_image_digest: ${{ inputs.engine_image_digest }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
      AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
      TF_VARS_DEV_PORTAL: ${{ secrets.TF_VARS_DEV_PORTAL }}
      TF_VARS_PROOF_PORTAL: ${{ secrets.TF_VARS_PROOF_PORTAL }}
      TF_VARS_PROD_PORTAL: ${{ secrets.TF_VARS_PROD_PORTAL }}
      TF_INFRA_STATE_BUCKET: ${{ secrets.TF_INFRA_STATE_BUCKET }}
      TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
      TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
      SHIFTER_CONFIG_DEV_RANGE: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
      SHIFTER_CONFIG_PROOF_RANGE: ${{ secrets.SHIFTER_CONFIG_PROOF_RANGE }}
      SHIFTER_CONFIG_PROD_RANGE: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}

  push-guacamole-images:
    uses: ./.github/workflows/_platform-push-guacamole-images.yml
    if: |
      inputs.apply_changes &&
      inputs.platform_changes &&
      github.event_name != 'pull_request'
    with:
      environment: ${{ inputs.environment }}
      github_environment: ${{ inputs.github_environment }}
      apply_changes: ${{ inputs.apply_changes }}
      platform_changes: ${{ inputs.platform_changes }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
      AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}

  apply:
    uses: ./.github/workflows/_platform-apply.yml
    needs: [plan, push-guacamole-images]
    if: |
      always() &&
      inputs.apply_changes &&
      inputs.platform_changes &&
      (needs.plan.result == 'success' || needs.plan.result == 'skipped') &&
      (needs.push-guacamole-images.result == 'success' || needs.push-guacamole-images.result == 'skipped') &&
      github.event_name != 'pull_request'
    with:
      environment: ${{ inputs.environment }}
      github_environment: ${{ inputs.github_environment }}
      is_dev: ${{ inputs.is_dev }}
      apply_changes: ${{ inputs.apply_changes }}
      platform_changes: ${{ inputs.platform_changes }}
      engine_image_digest: ${{ inputs.engine_image_digest }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
      AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
      TF_VARS_DEV_PORTAL: ${{ secrets.TF_VARS_DEV_PORTAL }}
      TF_VARS_PROOF_PORTAL: ${{ secrets.TF_VARS_PROOF_PORTAL }}
      TF_VARS_PROD_PORTAL: ${{ secrets.TF_VARS_PROD_PORTAL }}
      TF_INFRA_STATE_BUCKET: ${{ secrets.TF_INFRA_STATE_BUCKET }}
      TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
      TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
      SHIFTER_CONFIG_DEV_RANGE: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
      SHIFTER_CONFIG_PROOF_RANGE: ${{ secrets.SHIFTER_CONFIG_PROOF_RANGE }}
      SHIFTER_CONFIG_PROD_RANGE: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}

  build:
    uses: ./.github/workflows/_platform-build.yml
    needs: push-guacamole-images
    if: |
      always() &&
      inputs.apply_changes &&
      github.event_name != 'pull_request' &&
      (inputs.platform_changes || inputs.portal_image_changes) &&
      (needs.push-guacamole-images.result == 'success' ||
       needs.push-guacamole-images.result == 'skipped')
    with:
      environment: ${{ inputs.environment }}
      github_environment: ${{ inputs.github_environment }}
      portal_image_changes: ${{ inputs.portal_image_changes }}
      apply_changes: ${{ inputs.apply_changes }}
      platform_changes: ${{ inputs.platform_changes }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
      AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}

  eks-deploy:
    uses: ./.github/workflows/_platform-eks-deploy.yml
    needs: build
    if: |
      inputs.apply_changes &&
      inputs.eks_enabled &&
      github.event_name != 'pull_request' &&
      needs.build.result == 'success'
    with:
      environment: ${{ inputs.environment }}
      github_environment: ${{ inputs.github_environment }}
      eks_enabled: ${{ inputs.eks_enabled }}
      apply_changes: ${{ inputs.apply_changes }}
      image_digest: ${{ needs.build.outputs.image_digest }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
      AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
      TF_INFRA_STATE_BUCKET: ${{ secrets.TF_INFRA_STATE_BUCKET }}
      TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
      TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
      SHIFTER_CONFIG_DEV_RANGE: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
      SHIFTER_CONFIG_PROOF_RANGE: ${{ secrets.SHIFTER_CONFIG_PROOF_RANGE }}
      SHIFTER_CONFIG_PROD_RANGE: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}
      TF_VARS_DEV_EKS: ${{ secrets.TF_VARS_DEV_EKS }}
      TF_VARS_PROOF_EKS: ${{ secrets.TF_VARS_PROOF_EKS }}
      TF_VARS_PROD_EKS: ${{ secrets.TF_VARS_PROD_EKS }}

  deploy:
    uses: ./.github/workflows/_platform-deploy.yml
    needs: build
    if: |
      inputs.apply_changes &&
      github.event_name != 'pull_request' &&
      inputs.environment == '__legacy-disabled__'
    with:
      environment: ${{ inputs.environment }}
      github_environment: ${{ inputs.github_environment }}
      portal_image_changes: ${{ inputs.portal_image_changes }}
      apply_changes: ${{ inputs.apply_changes }}
      platform_changes: ${{ inputs.platform_changes }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
      AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
      TF_INFRA_STATE_BUCKET: ${{ secrets.TF_INFRA_STATE_BUCKET }}
      TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
      TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
      PLATFORM_BOOTSTRAP_STAFF_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_STAFF_EMAILS }}
      PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS }}

  verify:
    uses: ./.github/workflows/_platform-verify.yml
    needs: deploy
    if: inputs.apply_changes && github.event_name != 'pull_request' && needs.deploy.result == 'success'
    with:
      environment: ${{ inputs.environment }}
      github_environment: ${{ inputs.github_environment }}
      apply_changes: ${{ inputs.apply_changes }}
      # image_digest is intentionally not forwarded: the pre-refactor verify job
      # read `needs.build.outputs.image_digest` while needing only `deploy`, so
      # that reference already evaluated to empty at runtime. The child input
      # defaults to "" to preserve that exact behavior. See the ADR-003-R4
      # empty-digest note raised on issue #689 for the separate correctness fix.
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
      AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
      TF_INFRA_STATE_BUCKET: ${{ secrets.TF_INFRA_STATE_BUCKET }}
      TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
      TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}

  post-deploy-smoke:
    uses: ./.github/workflows/_platform-post-deploy-smoke.yml
    needs: eks-deploy
    if: |
      inputs.is_dev &&
      inputs.apply_changes &&
      github.event_name != 'pull_request' &&
      needs.eks-deploy.result == 'success'
    with:
      environment: ${{ inputs.environment }}
      github_environment: ${{ inputs.github_environment }}
      is_dev: ${{ inputs.is_dev }}
      apply_changes: ${{ inputs.apply_changes }}
    secrets:
      AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
      TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
      SMOKE_TEST_USER_EMAIL: ${{ secrets.SMOKE_TEST_USER_EMAIL }}
