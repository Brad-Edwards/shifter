name: Platform - eks-deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      eks_enabled:
        required: false
        type: boolean
        default: false
      apply_changes:
        required: true
        type: boolean
      image_digest:
        required: false
        type: string
        default: ""
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_ARN_DEV:
        required: true
      AWS_ROLE_ARN_PROOF:
        required: false
      TF_INFRA_STATE_BUCKET:
        required: false
      TF_INFRA_STATE_BUCKET_DEV:
        required: false
      TF_INFRA_STATE_BUCKET_PROOF:
        required: false
      SHIFTER_CONFIG_DEV_RANGE:
        required: false
      SHIFTER_CONFIG_PROOF_RANGE:
        required: false
      SHIFTER_CONFIG_PROD_RANGE:
        required: false
      TF_VARS_DEV_EKS:
        required: false
      TF_VARS_PROOF_EKS:
        required: false
      TF_VARS_PROD_EKS:
        required: false

jobs:
  eks-deploy:
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
      attestations: read
    name: Deploy EKS bundle (${{ inputs.environment }})
    runs-on: self-hosted
    timeout-minutes: 90
    environment: ${{ inputs.github_environment }}
    env:
      AWS_REGION: us-east-2
      ENVIRONMENT: ${{ inputs.environment }}
      PORTAL_IMAGE_DIGEST: ${{ inputs.image_digest }}
      SHIFTER_CONFIG_DEV: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
      SHIFTER_CONFIG_PROOF: ${{ secrets.SHIFTER_CONFIG_PROOF_RANGE }}
      SHIFTER_CONFIG_PROD: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Preflight EKS deployment prerequisites
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          TF_INFRA_STATE_BUCKET: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
          TF_VARS_DEV_EKS: ${{ secrets.TF_VARS_DEV_EKS }}
          TF_VARS_PROOF_EKS: ${{ secrets.TF_VARS_PROOF_EKS }}
          TF_VARS_PROD_EKS: ${{ secrets.TF_VARS_PROD_EKS }}
          SHIFTER_CONFIG_DEV_RANGE: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
          SHIFTER_CONFIG_PROOF_RANGE: ${{ secrets.SHIFTER_CONFIG_PROOF_RANGE }}
          SHIFTER_CONFIG_PROD_RANGE: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}
        run: uv run --project scripts/bootstrap python -m preflight --cloud aws --env "$ENVIRONMENT" --component eks --headless

      - name: Resolve AWS deploy role
        id: aws-role
        env:
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev) ROLE_ARN="$AWS_ROLE_ARN_DEV" ;;
            proof) ROLE_ARN="$AWS_ROLE_ARN_PROOF" ;;
            prod) ROLE_ARN="$AWS_ROLE_ARN_PROD" ;;
            *) echo "::error::Unsupported AWS environment: $ENVIRONMENT"; exit 1 ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::The protected AWS deploy role is not configured"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2

      - name: Render isolated EKS backend and protected inputs
        env:
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
          TF_INFRA_STATE_BUCKET_PROD: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          TF_VARS_DEV_EKS: ${{ secrets.TF_VARS_DEV_EKS }}
          TF_VARS_PROOF_EKS: ${{ secrets.TF_VARS_PROOF_EKS }}
          TF_VARS_PROD_EKS: ${{ secrets.TF_VARS_PROD_EKS }}
          DEPLOYMENT_ROLE_ARN: ${{ steps.aws-role.outputs.role_arn }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)
              STATE_BUCKET="$TF_INFRA_STATE_BUCKET_DEV"
              EKS_INPUTS="$TF_VARS_DEV_EKS"
              ;;
            proof)
              STATE_BUCKET="$TF_INFRA_STATE_BUCKET_PROOF"
              EKS_INPUTS="$TF_VARS_PROOF_EKS"
              ;;
            prod)
              STATE_BUCKET="$TF_INFRA_STATE_BUCKET_PROD"
              EKS_INPUTS="$TF_VARS_PROD_EKS"
              ;;
          esac
          if [ -z "$STATE_BUCKET" ] || [ -z "$EKS_INPUTS" ]; then
            echo "::error::The protected EKS state bucket or Terraform input payload is not configured"
            exit 1
          fi
          python3 scripts/terraform/render_aws_backend_configs.py \
            --bucket "$STATE_BUCKET" \
            --env "$ENVIRONMENT" \
            --stack eks \
            --github-env
          install -m 600 /dev/null "${RUNNER_TEMP}/eks.tfvars.json"
          printf '%s' "$EKS_INPUTS" |
            jq --arg role "$DEPLOYMENT_ROLE_ARN" '.deployment_role_arn = $role' \
              > "${RUNNER_TEMP}/eks.tfvars.json"
          jq -e 'type == "object"' "${RUNNER_TEMP}/eks.tfvars.json" >/dev/null
          echo "SHIFTER_EKS_TFVARS_PATH=${RUNNER_TEMP}/eks.tfvars.json" >> "$GITHUB_ENV"

      - name: Render protected root config and attested image identities
        env:
          GUACD_REPOSITORY: ${{ inputs.environment == 'prod' && 'shifter-guacd' || format('shifter-{0}-guacd', inputs.environment) }}
          GUACAMOLE_CLIENT_REPOSITORY: ${{ inputs.environment == 'prod' && 'shifter-guacamole-client' || format('shifter-{0}-guacamole-client', inputs.environment) }}
          PORTAL_REPOSITORY: ${{ inputs.environment == 'prod' && 'shifter-portal' || format('shifter-{0}-portal', inputs.environment) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev) ROOT_CONFIG="$SHIFTER_CONFIG_DEV" ;;
            proof) ROOT_CONFIG="$SHIFTER_CONFIG_PROOF" ;;
            prod) ROOT_CONFIG="$SHIFTER_CONFIG_PROD" ;;
          esac
          if [ -z "$ROOT_CONFIG" ]; then
            echo "::error::The protected shifter.yaml payload is not configured"
            exit 1
          fi
          install -m 600 /dev/null "${RUNNER_TEMP}/shifter.yaml"
          printf '%s' "$ROOT_CONFIG" > "${RUNNER_TEMP}/shifter.yaml"

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          guacd_digest="$(aws ecr describe-images --repository-name "$GUACD_REPOSITORY" \
            --image-ids imageTag=1.5.5-r1 --query 'imageDetails[0].imageDigest' --output text)"
          client_digest="$(aws ecr describe-images --repository-name "$GUACAMOLE_CLIENT_REPOSITORY" \
            --image-ids imageTag=1.5.5-r1 --query 'imageDetails[0].imageDigest' --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          platform_ref="${registry}/${PORTAL_REPOSITORY}@${PORTAL_IMAGE_DIGEST}"
          guacd_ref="${registry}/${GUACD_REPOSITORY}@${guacd_digest}"
          client_ref="${registry}/${GUACAMOLE_CLIENT_REPOSITORY}@${client_digest}"
          # ADR-037-R6: this workflow resolves/accepts the exact image identities
          # it deploys, so it must independently verify each one's OIDC-signed
          # attestation at THIS trust boundary before writing images.json and
          # applying it — a build-time attestation is not sufficient here. No bypass.
          verify_image() {
            ref="$1"; label="$2"
            if [[ ! "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${label} image is not digest-pinned (${ref}); refusing to deploy"
              exit 1
            fi
            echo "Verifying provenance for ${label} (${ref})"
            gh attestation verify "oci://${ref}" --repo Brad-Edwards/shifter
          }
          verify_image "$platform_ref" "portal"
          verify_image "$guacd_ref" "guacd"
          verify_image "$client_ref" "guacamole-client"
          jq -n \
            --arg platform "$platform_ref" \
            --arg guacd "$guacd_ref" \
            --arg client "$client_ref" \
            '{platform:$platform,guacd:$guacd,guacamoleClient:$client}' \
            > "${RUNNER_TEMP}/images.json"

      - name: Deploy through the canonical AWS bundle entrypoint
        run: |
          uv run --project scripts/bootstrap \
            python scripts/bootstrap/deploy.py eks-deploy \
            --config "${RUNNER_TEMP}/shifter.yaml" \
            --images "${RUNNER_TEMP}/images.json" \
            --backend-config "${SHIFTER_BACKEND_CONFIG_PATH}" \
            --terraform-inputs "${SHIFTER_EKS_TFVARS_PATH}"
