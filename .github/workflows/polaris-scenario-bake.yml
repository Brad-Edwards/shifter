name: Polaris Scenario Bake

# Operator-triggered bake of the Polaris polaris-vm AMI. Mirrors the
# workflow_dispatch-only shape of packer.yml: it consumes an operator-supplied
# build tarball from S3 -> stands up a golden range -> create-image -> updates
# SSM, and is never wired to push / pull_request / schedule triggers. The
# build content (flags/solutions) lives in the private penumbra-scenarios repo,
# not this public repo, so the operator uploads the tarball out of band before
# dispatching. See docs/architecture/polaris-repo-to-ami-drift-audit.md and
# docs/architecture/polaris-scenario-bake-preflight-618.md.
#
# Security posture: this is a privileged self-hosted workflow that assumes
# the selected environment's AWS role (dev or proof), resolved the same way
# as packer.yml / techvault-scenario-bake.yml. The bake source `ref` is
# constrained to protected
# branches (choice input) so a dispatcher cannot run unreviewed code with
# the bake credentials. Free-form inputs are bound to environment
# variables and validated against strict allowlists before any AWS step,
# never interpolated into shell text — so a crafted input cannot inject
# shell commands on the runner.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Protected branch to bake from'
        required: true
        type: choice
        options:
          - dev
          - main
      environment:
        description: 'AWS environment to bake in'
        required: true
        type: choice
        options:
          - dev
          - proof
        default: dev
      s3_bucket:
        description: 'S3 bucket holding the operator-uploaded Polaris build tarball (e.g. shifter-polaris-bake-<account-id>)'
        required: true
        type: string
      s3_key:
        description: 'S3 key of the operator-uploaded Polaris build tarball (from penumbra-scenarios scenarios/polaris/build, staged as scenario-dev/polaris/build)'
        required: false
        type: string
        default: 'polaris/build-v1.tar.gz'
      ssm_parameter:
        description: 'SSM parameter to update (must be under /shifter/ami/)'
        required: false
        type: string
        default: '/shifter/ami/polaris-vm'

permissions:
  id-token: write
  contents: read

jobs:
  bake:
    name: Bake polaris-vm AMI in ${{ inputs.environment }}
    runs-on: self-hosted

    env:
      AWS_REGION: us-east-2
      RANGE_DIR: scripts/polaris-aws-range
      # Free-form inputs are bound here as plain environment variables.
      # Env-var *values* are never re-parsed as shell code, so referencing
      # them as "$S3_BUCKET" etc. in run blocks is injection-safe — unlike
      # ${{ inputs.* }} which expands into the script text before bash.
      ENVIRONMENT: ${{ inputs.environment }}
      S3_BUCKET: ${{ inputs.s3_bucket }}
      S3_KEY: ${{ inputs.s3_key }}
      SSM_PARAMETER: ${{ inputs.ssm_parameter }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Validate operator inputs
        run: |
          set -euo pipefail
          if ! printf '%s' "$S3_BUCKET" | grep -qE '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'; then
            echo "::error::s3_bucket is not a valid S3 bucket name"
            exit 1
          fi
          if ! printf '%s' "$S3_KEY" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::s3_key contains characters outside [A-Za-z0-9._/-]"
            exit 1
          fi
          if ! printf '%s' "$SSM_PARAMETER" | grep -qE '^/shifter/ami/[A-Za-z0-9._-]+$'; then
            echo "::error::ssm_parameter must match /shifter/ami/<name>"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python venv
        run: |
          set -euo pipefail
          # Self-hosted runners are Amazon Linux 2023: system python3 ships venv +
          # ensurepip, there is no actions/setup-python tool cache, and there is
          # no apt. A venv from system python3 gives the health-check step an
          # isolated, writable env (pip via ensurepip) without touching the
          # PEP 668 externally-managed system pip.
          python3 -m venv "${RUNNER_TEMP}/venv"
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"

      # The Polaris build content (scenario-dev/polaris/build/ — flags, solutions,
      # generated artifacts) is intentionally NOT in this public repo. It lives in
      # the private penumbra-scenarios repo and reaches the bake as an operator-
      # uploaded S3 tarball (see "Verify operator-supplied Polaris build tarball"
      # below). Flag-baking verification is therefore owned by penumbra-scenarios'
      # own CI (scenarios/polaris/build/test_verify_flags_baked.py), not here.

      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (${{ inputs.environment }})
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2

      - name: Verify operator-supplied Polaris build tarball
        run: |
          set -euo pipefail
          # The build tarball (scenario-dev/polaris/build/*) is produced from the
          # private penumbra-scenarios repo (scenarios/polaris/build staged under
          # scenario-dev/polaris/build) and uploaded to S3 out of band, because
          # the content is intentionally not in this public repo. Fail loud if it
          # is missing rather than standing up an empty range.
          if ! aws s3api head-object --bucket "$S3_BUCKET" --key "$S3_KEY" >/dev/null 2>&1; then
            echo "::error::build tarball s3://${S3_BUCKET}/${S3_KEY} not found - upload it from penumbra-scenarios before running this bake"
            exit 1
          fi
          echo "TARBALL_S3_URI=s3://${S3_BUCKET}/${S3_KEY}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Terraform apply — stand up golden bake range
        working-directory: ${{ env.RANGE_DIR }}
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var "build_tarball_s3_uri=${TARBALL_S3_URI}" \
            -var "build_tarball_bucket=${S3_BUCKET}"
          POLARIS_INSTANCE_ID="$(terraform output -json range_polaris_instance_ids | jq -r '."0"')"
          echo "POLARIS_INSTANCE_ID=${POLARIS_INSTANCE_ID}" >> "$GITHUB_ENV"

      - name: Wait for the range bootstrap to complete
        run: |
          set -euo pipefail
          aws ec2 wait instance-status-ok --instance-ids "$POLARIS_INSTANCE_ID"
          # user_data builds + starts the 17-container compose stack; poll
          # the bootstrap log for the completion marker, bounded to 30 min.
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            cmd_id="$(aws ssm send-command \
              --instance-ids "$POLARIS_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["grep -c \"polaris bootstrap complete\" /var/log/polaris-bootstrap.log || true"]' \
              --query 'Command.CommandId' --output text)"
            sleep 10
            hits="$(aws ssm get-command-invocation \
              --command-id "$cmd_id" --instance-id "$POLARIS_INSTANCE_ID" \
              --query 'StandardOutputContent' --output text 2>/dev/null | tr -d '[:space:]' || echo 0)"
            if [ "${hits:-0}" != "0" ]; then
              echo "range bootstrap complete"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::range bootstrap did not complete within 30 minutes"
              exit 1
            fi
            sleep 30
          done

      - name: Health-check the golden range
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          python "${RANGE_DIR}/check_range_health.py" \
            --instance-ids "$POLARIS_INSTANCE_ID" \
            --output range-health.md
          cat range-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create AMI from the golden range
        run: |
          set -euo pipefail
          ami_name="polaris-vm-${RUN_ID}"
          AMI_ID="$(aws ec2 create-image \
            --instance-id "$POLARIS_INSTANCE_ID" \
            --name "$ami_name" \
            --description "Polaris scenario AMI baked by GitHub Actions run ${RUN_ID}" \
            --no-reboot \
            --query 'ImageId' --output text)"
          echo "AMI_ID=${AMI_ID}" >> "$GITHUB_ENV"
          echo "waiting for AMI ${AMI_ID} to become available..."
          aws ec2 wait image-available --image-ids "$AMI_ID"
          {
            echo "## Polaris AMI Bake Complete"
            echo "- **AMI name:** \`${ami_name}\`"
            echo "- **AMI ID:** \`${AMI_ID}\`"
            echo "- **Region:** us-east-2"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update SSM parameter
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "$SSM_PARAMETER" \
            --type String \
            --value "$AMI_ID" \
            --overwrite \
            --description "Polaris AMI baked by GitHub Actions run ${RUN_ID}"
          {
            echo "- **SSM parameter:** \`${SSM_PARAMETER}\` updated"
            echo ""
            echo "**Next step:** test the new AMI in ${ENVIRONMENT} before promoting."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy — tear down the bake range
        if: always()
        working-directory: ${{ env.RANGE_DIR }}
        run: |
          set -euo pipefail
          if [ -f terraform.tfstate ] || [ -d .terraform ]; then
            terraform destroy -input=false -auto-approve \
              -var "build_tarball_s3_uri=${TARBALL_S3_URI:-s3://${S3_BUCKET}/${S3_KEY}}" \
              -var "build_tarball_bucket=${S3_BUCKET}"
          else
            echo "no terraform state — nothing to destroy"
          fi
