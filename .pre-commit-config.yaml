fail_fast: true

# Pre-commit is deliberately scoped to FAST hygiene + secret scanning only.
# Everything heavier — mypy, the full test suites, bandit/checkov SAST, the
# terraform/k8s validators, the check_tf_* IAM guards, and the adr_guard /
# import-linter architecture gates — runs in CI (`.github/workflows/`), which is
# the authoritative enforcer. Keep this file to formatters, syntax/file checks,
# and secret detection so local commits stay quick; do not re-add slow or
# duplicative gates here.

repos:
  # =============================================================================
  # STAGE 0: Commit message policy (commit-msg hook)
  # =============================================================================
  - repo: local
    hooks:
      - id: block-agent-attribution-commit-msg
        name: block agent attribution in commit messages
        entry: python3 scripts/adr_guard/block_agent_attribution_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

  # =============================================================================
  # STAGE 1: Fast checks (file hygiene, secret scanning, linting, formatting)
  # =============================================================================

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^assets/styles/
      - id: check-yaml
        args: [--unsafe] # Allow custom YAML constructors (mkdocs plugins)
        exclude: ^platform/charts/.*/templates/.*\.ya?ml$
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
        # Exclude: tests (check key format strings) + crypto.py (key generation module, not leaked secrets)
        # Plus POLARIS CTF range lab material (intentional training-range
        # keypairs that live inside the disposable docker-compose range
        # — not real credentials, useless outside the range):
        exclude: ^(shifter/engine/provisioner/tests/|shifter/shifter_platform/tests/engine/ssh/|scripts/bootstrap/tests/|shifter/engine/provisioner/utils/crypto\.py|scenario-dev/polaris/build/_shared/)

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.yml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]

  # Python - Ruff (linting + formatting)
  # Note: Ruff handles import sorting via "I" rules - no separate isort needed
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        name: ruff (shifter_platform)
        args: [--fix]
        files: ^shifter/shifter_platform/
      - id: ruff-format
        name: ruff-format (shifter_platform)
        files: ^shifter/shifter_platform/
      - id: ruff
        name: ruff (provisioner)
        args: [--fix]
        files: ^shifter/engine/provisioner/
      - id: ruff-format
        name: ruff-format (provisioner)
        files: ^shifter/engine/provisioner/
      - id: ruff
        name: ruff (packer)
        args: [--fix]
        files: ^shifter/packer/
      - id: ruff-format
        name: ruff-format (packer)
        files: ^shifter/packer/
      - id: ruff
        name: ruff (bootstrap)
        args: [--fix]
        files: ^scripts/bootstrap/
      - id: ruff-format
        name: ruff-format (bootstrap)
        files: ^scripts/bootstrap/
      - id: ruff
        name: ruff (gcp scripts)
        args: [--fix]
        files: ^scripts/gcp/
      - id: ruff-format
        name: ruff-format (gcp scripts)
        files: ^scripts/gcp/
      - id: ruff
        name: ruff (check_layer_imports)
        args: [--fix]
        files: ^scripts/check_layer_imports/
      - id: ruff-format
        name: ruff-format (check_layer_imports)
        files: ^scripts/check_layer_imports/
      - id: ruff
        name: ruff (check_rds_pending_modifications)
        args: [--fix]
        files: ^scripts/check_rds_pending_modifications/
      - id: ruff-format
        name: ruff-format (check_rds_pending_modifications)
        files: ^scripts/check_rds_pending_modifications/
      - id: ruff
        name: ruff (assert_portal_inspection)
        args: [--fix]
        files: ^scripts/assert_portal_inspection/
      - id: ruff-format
        name: ruff-format (assert_portal_inspection)
        files: ^scripts/assert_portal_inspection/
      - id: ruff
        name: ruff (handle_sd_replacement)
        args: [--fix]
        files: ^scripts/handle_sd_replacement/
      - id: ruff-format
        name: ruff-format (handle_sd_replacement)
        files: ^scripts/handle_sd_replacement/
      - id: ruff
        name: ruff (installation)
        args: [--fix]
        files: ^shifter/installation/
      - id: ruff-format
        name: ruff-format (installation)
        files: ^shifter/installation/
      - id: ruff
        name: ruff (event-load-harness)
        args: [--fix]
        files: ^uat/event-load-harness/
      - id: ruff-format
        name: ruff-format (event-load-harness)
        files: ^uat/event-load-harness/

  # JavaScript/CSS linting
  - repo: local
    hooks:
      - id: eslint-shifter-platform
        name: eslint (shifter_platform)
        entry: bash -c 'cd shifter/shifter_platform && npx eslint --fix static/js/'
        language: system
        files: ^shifter/shifter_platform/static/js/.*\.js$
        types: [javascript]

      - id: eslint-mcp-shifter-db
        name: eslint (mcp/shifter-db)
        entry: bash -c 'cd mcp/shifter-db && npx eslint .'
        language: system
        files: ^mcp/shifter-db/.*\.js$
        types: [javascript]

      - id: eslint-mcp-ngfw
        name: eslint (mcp/ngfw)
        entry: bash -c 'cd mcp/ngfw && npx eslint .'
        language: system
        files: ^mcp/ngfw/.*\.js$
        types: [javascript]

      - id: eslint-mcp-aws
        name: eslint (mcp/aws)
        entry: bash -c 'cd mcp/aws && npx eslint .'
        language: system
        files: ^mcp/aws/.*\.js$
        types: [javascript]

      - id: stylelint-shifter-platform
        name: stylelint (shifter_platform)
        entry: bash -c 'cd shifter/shifter_platform && npx stylelint --fix static/css/'
        language: system
        files: ^shifter/shifter_platform/static/css/.*\.css$
        types: [css]

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/

  # Terraform formatting (fast, hygiene only). tflint/validate, checkov, and the
  # check_tf_* IAM guards run in CI, not here.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        files: ^platform/terraform/
