# Local commits run fast hygiene and secrets checks only.
# Full tests, type checking, architecture and infrastructure scans run in CI.
fail_fast: true

# Keep the local commit boundary intentionally fast. Repository-wide type,
# architecture, policy, IaC security, migration, and test suites run in CI.
repos:
  - repo: local
    hooks:
      - id: block-agent-attribution-commit-msg
        name: block agent attribution in commit messages
        entry: python3 scripts/adr_guard/block_agent_attribution_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

  # =============================================================================
  # Fast checks on staged files (linting, formatting, syntax)
  # =============================================================================

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^assets/styles/
      - id: check-yaml
        args: [--unsafe]
        exclude: ^platform/charts/.*/templates/.*\.ya?ml$
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
        # Exclude: tests (check key format strings) + crypto.py (key generation module, not leaked secrets)
        exclude: ^(shifter/engine/provisioner/tests/|shifter/shifter_platform/tests/engine/ssh/|scripts/bootstrap/tests/|shifter/engine/provisioner/utils/crypto\.py)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]

  # Lightweight syntax, lint, and formatting hooks remain local.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.yml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        name: ruff (shifter_platform)
        args: [--fix]
        files: ^shifter/shifter_platform/
      - id: ruff-format
        name: ruff-format (shifter_platform)
        files: ^shifter/shifter_platform/
      - id: ruff
        name: ruff (provisioner)
        args: [--fix]
        files: ^shifter/engine/provisioner/
      - id: ruff-format
        name: ruff-format (provisioner)
        files: ^shifter/engine/provisioner/
      - id: ruff
        name: ruff (packer)
        args: [--fix]
        files: ^shifter/packer/
      - id: ruff-format
        name: ruff-format (packer)
        files: ^shifter/packer/
      - id: ruff
        name: ruff (bootstrap)
        args: [--fix]
        files: ^scripts/bootstrap/
      - id: ruff-format
        name: ruff-format (bootstrap)
        files: ^scripts/bootstrap/
      - id: ruff
        name: ruff (gcp scripts)
        args: [--fix]
        files: ^scripts/gcp/
      - id: ruff-format
        name: ruff-format (gcp scripts)
        files: ^scripts/gcp/
      - id: ruff
        name: ruff (check_layer_imports)
        args: [--fix]
        files: ^scripts/check_layer_imports/
      - id: ruff-format
        name: ruff-format (check_layer_imports)
        files: ^scripts/check_layer_imports/
      - id: ruff
        name: ruff (check_rds_pending_modifications)
        args: [--fix]
        files: ^scripts/check_rds_pending_modifications/
      - id: ruff-format
        name: ruff-format (check_rds_pending_modifications)
        files: ^scripts/check_rds_pending_modifications/
      - id: ruff
        name: ruff (assert_portal_inspection)
        args: [--fix]
        files: ^scripts/assert_portal_inspection/
      - id: ruff-format
        name: ruff-format (assert_portal_inspection)
        files: ^scripts/assert_portal_inspection/
      - id: ruff
        name: ruff (handle_sd_replacement)
        args: [--fix]
        files: ^scripts/handle_sd_replacement/
      - id: ruff-format
        name: ruff-format (handle_sd_replacement)
        files: ^scripts/handle_sd_replacement/
      - id: ruff
        name: ruff (installation)
        args: [--fix]
        files: ^shifter/installation/
      - id: ruff-format
        name: ruff-format (installation)
        files: ^shifter/installation/
      - id: ruff
        name: ruff (event-load-harness)
        args: [--fix]
        files: ^uat/event-load-harness/
      - id: ruff-format
        name: ruff-format (event-load-harness)
        files: ^uat/event-load-harness/

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/

  # Terraform formatting only; validation and provider linting run in CI
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        files: ^platform/terraform/

  # Changed-file cloud identifier hygiene
  - repo: local
    hooks:
      - id: adr-guard-identifiers
        name: architecture (adr guard live cloud identifiers)
        entry: python3 scripts/adr_guard/adr_guard.py --checks no-live-cloud-identifiers --changed
        language: system
        pass_filenames: false
        verbose: true
