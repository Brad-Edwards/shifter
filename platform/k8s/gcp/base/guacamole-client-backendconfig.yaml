apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: guacamole-client-backendconfig
  namespace: shifter-platform
  labels:
    app.kubernetes.io/part-of: shifter
    app.kubernetes.io/component: guacamole-client
spec:
  # GCP interprets a backend service's timeout as the MAXIMUM lifetime of a
  # WebSocket connection, not just an idle/request timeout. The GKE default of
  # 30s therefore severs every Guacamole tunnel after 30 seconds, breaking
  # interactive range terminals. Raise it so sessions stay connected.
  timeoutSec: 86400
