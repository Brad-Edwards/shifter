provider:
  name: gcp
profile: dev

deployment:
  profile: dev

capabilities:
  gcpBackendConfig: true
  gcpManagedTls: true
  kubernetesJobLauncher: true

images:
  platform: us-docker.pkg.dev/placeholder-project/shifter/platform@sha256:1111111111111111111111111111111111111111111111111111111111111111
  guacd: us-docker.pkg.dev/placeholder-project/shifter/guacd@sha256:2222222222222222222222222222222222222222222222222222222222222222
  guacamoleClient: us-docker.pkg.dev/placeholder-project/shifter/guacamole-client@sha256:3333333333333333333333333333333333333333333333333333333333333333

imagePullPolicy: Always

# Event capacity (KeplerOps CTF, 300 concurrent ranges). Static on purpose:
# an HPA reacts after CPU climbs, which is the wrong shape when 300 participants
# connect inside the same few minutes. RDP is the only participant access path,
# so guacd is the tier that must not pin. Scale back down after the event.
portal:
  replicas: 24
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 128Mi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 256Mi

workers:
  cms:
    replicas: 3
  engine:
    replicas: 3
  mc:
    replicas: 3
  ctfScheduler:
    replicas: 1

guacd:
  replicas: 120
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 128Mi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 256Mi

guacamoleClient:
  replicas: 24
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 128Mi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 256Mi

services:
  portal:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
    backendConfig:
      enabled: true
  guacamoleClient:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'

network:
  ingressSourceCidrs:
    - 35.191.0.0/16
    - 130.211.0.0/22
  providerApiCidrs:
    - 199.36.153.4/30
    - 199.36.153.8/30

edge:
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: gce
