site_name: Shifter Documentation
site_description: Deploy, operate, and develop the Shifter cyber-range platform.
site_url: https://brad-edwards.github.io/shifter/
repo_url: https://github.com/Brad-Edwards/shifter
repo_name: Brad-Edwards/shifter
edit_uri: edit/dev/docs/
docs_dir: docs

# Phase A (issue #1595) publishes the deploy & operations docs that already live
# under top-level docs/. Product/user docs and the retirement of the in-app
# Django docs app follow in Phase B (#1596); the nav grows then. Internal design
# notes are kept in-repo but off the public site via exclude_docs below.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Keep internal design notes and machine registries in the repo but off the
# public site (they are not prose docs). Everything published is listed in nav.
exclude_docs: |
  architecture/
  audit/
  design/
  research/
  adr/*.yaml
  adr/complexity-backlog.md
  adr-enforcement-plan.md

nav:
  - Home: index.md
  - Deploy & operations:
      - Deploy secrets and variables: dev/deploy-secrets.md
      - AWS Terraform apply order: dev/aws-terraform-apply-order.md
      - AWS AMI seeding: dev/aws-ami-seeding-runbook.md
      - AWS runner provisioning: dev/aws-runner-provisioning-runbook.md
      - AWS environment teardown: dev/aws-teardown-runbook.md
      - GCP range-cell deploy: dev/gcp-range-cell-deploy.md
      - Polaris on the GCP range-cell: dev/polaris-gcp-range-cell.md
      - Secrets rotation: dev/secrets-rotation-runbook.md
      - Service Discovery ForceNew: dev/service-discovery-forcenew.md
  - Operations runbooks:
      - Disaster recovery: ops/disaster-recovery.md
      - GitHub runner health alerts: ops/github-runner-health-alerts.md
      - TechVault golden AMI bake: ops/techvault-bake-runbook.md
  - Governance:
      - ADR enforcement: adr/README.md
