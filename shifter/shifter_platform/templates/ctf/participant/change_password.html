{% load i18n %}
<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% trans "Change CTF password" %}</title></head>
  <body>
    <main>
      <h1>{% trans "Choose a new password" %}</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% trans "Change password" %}</button>
      </form>
    </main>
  </body>
</html>
