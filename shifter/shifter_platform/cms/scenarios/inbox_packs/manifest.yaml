# In-box environment-pack manifest (#1578, ADR-034).
#
# Declares the scenario packs Shifter ships by default. The bootstrap
# (`cms.scenarios.inbox.register_inbox_packs`, invoked by the
# `bootstrap_inbox_catalog` management command) registers each entry through the
# SAME `cms.services.register_pack` service an operator uses. The in-box catalog
# therefore has NO privileged load path — it is dogfooded through the uniform
# ingestion boundary (ADR-033/ADR-034).
#
packs:
  - scenario_id: polaris
    source_kind: repo
    contract_kind: raes
    contract_profile: shifter
    package_ref: scenario-dev/polaris
    package_version: "0.1.0"
    package_digest: sha256:f1e5a984f2965a7086f10ed7d5dd4322ab3b71843a3c9758258817d514d23058
    provenance:
      repo: Brad-Edwards/shifter
