id: basic
# aws-dev portal redeploy trigger for #1168 G-C (no functional change)
name: Basic Range
description: A basic attacker-victim range with Kali Linux attacker and user-provided agent on victim.
enabled: true
ngfw: false

instances:
  - name: Attacker
    role: attacker
    os_type: kali
    xdr_agent: false

  - name: Workstation
    role: victim
    os_type: from_agent
    xdr_agent: false

subnets:
  - name: core
    instances: [Attacker, Workstation]
